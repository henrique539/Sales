<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabagram · Gerencial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3254;--gold:#c8960a;--gold-l:#e0aa18;
  --bg:#f4f6f9;--white:#fff;--s2:#f8f9fc;
  --border:#e2e7ef;--text:#1a2540;--text2:#3d5073;--muted:#7589a8;--dim:#a8b8cf;
  --red:#c0392b;--rbg:rgba(192,57,43,.07);--rbd:rgba(192,57,43,.2);
  --amber:#d97706;--abg:rgba(217,119,6,.07);--abd:rgba(217,119,6,.2);
  --green:#1a7a4a;--gbg:rgba(26,122,74,.07);--gbd:rgba(26,122,74,.2);
  --blue:#1e5fa0;--bbg:rgba(30,95,160,.07);--bbd:rgba(30,95,160,.2);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* HEADER */
.hdr{background:var(--navy);height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:200}
.logo{font-weight:800;font-size:15px;color:white;letter-spacing:.04em}.logo span{color:var(--gold-l)}
.hsep{width:1px;height:16px;background:rgba(255,255,255,.15)}
.hdr-badge{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.06em}
#clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.35)}
.hbtn{background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);font-size:11px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:4px;transition:all .15s}
.hbtn-ghost{background:transparent;border:0.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
/* NAV */
.nav{background:var(--white);border-bottom:0.5px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:6px;height:40px;flex-shrink:0;position:relative;z-index:150}
.nbtn{display:flex;align-items:center;gap:5px;padding:0 12px;height:28px;border-radius:7px;font-size:12px;font-weight:600;background:var(--s2);border:0.5px solid var(--border);color:var(--text);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .15s}
.nbtn:hover{background:var(--border)}.nbtn.on{background:var(--navy);color:white;border-color:var(--navy)}
.nav-right{margin-left:auto;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
/* CONTEÚDO */
.content{overflow-y:auto;flex:1;padding:16px 20px 40px}
/* STATUS BAR */
.sbar{background:var(--white);border-bottom:0.5px solid var(--border);padding:4px 20px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite}
.spin-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:20px 0}

/* ── TIME GERAL ── */
.tg-metas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tg-meta{border-radius:12px;padding:14px 16px}
.tg-meta-val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.tg-meta-sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:8px}
.tg-bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-bottom:6px}
.tg-bar-fill{height:5px;border-radius:3px}
.tg-meta-info{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.45)}

.tg-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tg-card{background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px}
.tg-card-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;gap:5px}

/* Ações */
.acao-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:5px;cursor:pointer}
.acao-num{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:1px}
.acao-titulo{font-size:12px;font-weight:600;margin-bottom:1px}
.acao-txt{font-size:11px;line-height:1.45}

/* Pulso */
.pulso-row{display:grid;grid-template-columns:1fr 36px 36px 36px 36px;gap:4px;align-items:center;padding:6px 4px;border-radius:8px;border-left:3px solid;margin-bottom:3px}
.pulso-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;flex-shrink:0}
.pulso-nome{font-size:12px;font-weight:600;color:var(--text)}
.pulso-tag{display:inline-flex;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600;margin-top:2px}
.pulso-val{text-align:center;font-size:12px;font-weight:700}

/* Barras progresso */
.prog-row{display:grid;grid-template-columns:90px 1fr 90px 38px;gap:8px;align-items:center;margin-bottom:8px}
.prog-bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.prog-fill{height:6px;border-radius:3px}

/* ── CARDS VENDEDORES ── */
.vd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vd-card{background:var(--white);border:0.5px solid var(--border);border-radius:12px;overflow:hidden}
.vd-hdr{padding:11px 13px;display:flex;align-items:center;justify-content:space-between}
.vd-av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:white;flex-shrink:0}
.vd-nome{font-size:13px;font-weight:700;color:white}
.vd-sub{font-size:10px;color:rgba(255,255,255,.45)}
.vd-pct{font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace}
.vd-fat{font-size:9px;color:rgba(255,255,255,.4);text-align:right}
.vd-body{padding:10px 13px}
.vd-prog{height:3px;background:var(--s2);border-radius:2px;overflow:hidden;margin-bottom:8px}
.vd-alert{display:flex;align-items:flex-start;gap:6px;padding:7px 9px;border-radius:7px;margin-bottom:7px;font-size:11px;line-height:1.45}
.vd-mets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:8px}
.vd-met{background:var(--s2);border-radius:6px;padding:5px 8px;text-align:center}
.vd-met-v{font-size:13px;font-weight:700;color:var(--text)}
.vd-met-l{font-size:9px;color:var(--muted);margin-top:1px}
.vd-atitude{border-left:3px solid;padding:7px 10px;border-radius:0 7px 7px 0;background:var(--s2)}
.vd-atitude-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.vd-atitude-txt{font-size:11px;color:var(--text);line-height:1.5}
.vd-ver{font-size:11px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:4px;margin-top:8px;cursor:pointer}

/* ── DETALHE VENDEDOR ── */
.detail{background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:20px;margin-top:14px}
.detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.av-lg{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:white;flex-shrink:0}
.detail-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.detail-sub{font-size:11px;color:var(--muted);margin-top:2px}
.st-tag{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-left:8px;vertical-align:middle}
.st-c{background:var(--rbg);color:var(--red);border:0.5px solid var(--rbd)}
.st-a{background:var(--abg);color:var(--amber);border:0.5px solid var(--abd)}
.st-g{background:var(--gbg);color:var(--green);border:0.5px solid var(--gbd)}
.det-mets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.dm{background:var(--s2);border:0.5px solid var(--border);border-radius:8px;padding:9px 11px}
.dm-v{font-size:15px;font-weight:800;letter-spacing:-.2px;font-family:'JetBrains Mono',monospace;margin-bottom:2px}
.dm-l{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.07em;text-transform:uppercase}
.det-prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:4px}
.det-prog-fill{height:4px;border-radius:2px;transition:width .8s}
.det-prog-lbl{font-size:10px;color:var(--muted);text-align:right;font-family:'JetBrains Mono',monospace;margin-bottom:14px}
.tabs-nav{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab-btn{padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:-1px;transition:all .15s}
.tab-btn:hover{color:var(--text)}.tab-btn.on{color:var(--navy);border-bottom-color:var(--navy)}

/* ── DIAGNÓSTICO EM CARDS ── */
.diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.diag-card{background:var(--white);border:0.5px solid var(--border);border-left:3px solid;border-radius:0 10px 10px 0;padding:11px 13px}
.diag-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.diag-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.diag-title{font-size:12px;font-weight:700;color:var(--text)}
.diag-sub{font-size:10px;color:var(--muted);margin-top:1px}
.diag-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.diag-tag{display:inline-flex;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600}
.diag-txt{font-size:11px;color:var(--text2);line-height:1.6}
.diag-txt strong{color:var(--text);font-weight:700}
.diag-num{width:17px;height:17px;border-radius:50%;background:var(--navy);color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.pergunta-box{background:var(--navy);border-radius:8px;padding:11px 13px}
.pergunta-txt{font-size:12px;color:rgba(255,255,255,.9);line-height:1.65;font-style:italic;margin-bottom:8px}
.pergunta-why-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.pergunta-why{font-size:11px;color:rgba(255,255,255,.55);line-height:1.55}

/* ── ATIVIDADES 2 COLUNAS ── */
.atv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.atv-col-title{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:4px}
.atv-item{background:var(--white);border:0.5px solid var(--border);border-left:3px solid;border-radius:0 8px 8px 0;padding:8px 10px;margin-bottom:5px}
.atv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.atv-nome{font-size:11px;font-weight:700;color:var(--text)}
.atv-hora{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.atv-badge{display:inline-flex;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600;margin-top:2px}
.atv-txt{font-size:11px;color:var(--text2);line-height:1.45;margin-top:3px}
.atv-txt strong{color:var(--text);font-weight:700}

/* ── FILA ── */
.fila-item{border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px}
.fila-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--s2);border-bottom:0.5px solid var(--border)}
.fila-nome{font-size:13px;font-weight:700;color:var(--text)}
.fila-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.fb-call{background:#e6f1fb;color:#185fa5}.fb-wa{background:#eaf3de;color:#1a7a4a}
.fila-body{padding:10px 13px}
.fila-script{background:var(--navy);color:rgba(255,255,255,.9);border-radius:6px;padding:9px 12px;font-size:12px;font-style:italic;line-height:1.6}
.fila-script-tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-l);margin-bottom:4px;font-style:normal}

.bu-sec{margin-bottom:20px}
.bu-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:0.5px solid var(--border)}
.bu-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;color:white}
.bu-mi{background:var(--navy)}.bu-obras{background:#5f3a1a}.bu-me{background:#1a5f3a}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vc{background:var(--white);border:0.5px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s}
.vc:hover{border-color:var(--navy)}.vc.sel{border-color:var(--navy);border-width:1.5px}
.vc-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white;flex-shrink:0}
.vc-nome{font-size:13px;font-weight:700;color:var(--text);line-height:1.2}
.vc-sub{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%}
.dr{background:var(--red)}.da{background:var(--amber)}.dg{background:var(--green)}
.vc-val{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.2px;margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.vprog{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:6px}
.vpf{height:3px;border-radius:2px}
.vc-footer{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap}
.vf-item{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
.wa-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.wb-ok{background:#eaf3de;color:#1a5f3a}.wb-warn{background:#faeeda;color:#633806}.wb-na{background:var(--s2);color:var(--muted)}

/* ── BU FILTER + VENDOR CARD ── */
.bu-filter-btn{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:600;background:var(--s2);border:0.5px solid var(--border);color:var(--text2);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .15s}
.bu-filter-btn:hover{background:var(--border)}.bu-filter-btn.on{background:var(--navy);color:white;border-color:var(--navy)}
.vt-card{background:var(--white);border:0.5px solid var(--border);border-left:3px solid;border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s}
.vt-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.vt-card.sel{box-shadow:0 0 0 2px var(--navy);transform:none}
</style>
</head>
<body>
<header class="hdr">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="logo">SABA<span>GRAM</span></div>
    <div class="hsep"></div>
    <div class="hdr-badge" id="hdrBadge">VISÃO GERENCIAL</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="clock"></div>
    <a href="usuarios.html" style="display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;text-decoration:none">👥 Usuários</a>
    <div style="position:relative" id="previewWrap">
      <button class="hbtn" onclick="togglePreview()" style="font-size:10px;padding:5px 10px">👤 Ver como vendedor</button>
      <div id="previewMenu" style="display:none;position:absolute;right:0;top:36px;background:white;border:0.5px solid #e2e7ef;border-radius:10px;padding:6px;min-width:180px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.12)">
        <div style="font-size:9px;font-weight:700;color:#7589a8;text-transform:uppercase;letter-spacing:.07em;padding:4px 8px 6px">Visualizar como</div>
        <a href="vendedor.html?preview=nando@sabagram.com.br" target="_blank" style="display:block;padding:6px 8px;font-size:12px;font-weight:600;color:#1a2540;text-decoration:none;border-radius:6px;background:transparent" onmouseover="this.style.background='#f4f6f9'" onmouseout="this.style.background='transparent'">SA · Sizenando</a>
        <a href="vendedor.html?preview=kelly@sabagram.com.br" target="_blank" style="display:block;padding:6px 8px;font-size:12px;font-weight:600;color:#1a2540;text-decoration:none;border-radius:6px" onmouseover="this.style.background='#f4f6f9'" onmouseout="this.style.background='transparent'">KJ · Kelly</a>
        <a href="vendedor.html?preview=marcelo@sabagram.com.br" target="_blank" style="display:block;padding:6px 8px;font-size:12px;font-weight:600;color:#1a2540;text-decoration:none;border-radius:6px" onmouseover="this.style.background='#f4f6f9'" onmouseout="this.style.background='transparent'">MM · Marcelo</a>
        <a href="vendedor.html?preview=renata@sabagram.com.br" target="_blank" style="display:block;padding:6px 8px;font-size:12px;font-weight:600;color:#1a2540;text-decoration:none;border-radius:6px" onmouseover="this.style.background='#f4f6f9'" onmouseout="this.style.background='transparent'">RS · Renata</a>
        <a href="vendedor.html?preview=cezar@sabagram.com.br" target="_blank" style="display:block;padding:6px 8px;font-size:12px;font-weight:600;color:#1a2540;text-decoration:none;border-radius:6px" onmouseover="this.style.background='#f4f6f9'" onmouseout="this.style.background='transparent'">CF · Cezar</a>
        <a href="vendedor.html?preview=diana@sabagram.com.br" target="_blank" style="display:block;padding:6px 8px;font-size:12px;font-weight:600;color:#1a2540;text-decoration:none;border-radius:6px" onmouseover="this.style.background='#f4f6f9'" onmouseout="this.style.background='transparent'">DR · Diana</a>
      </div>
    </div>
    <button class="hbtn-ghost" onclick="sair()">Sair</button>
  </div>
</header>

<div class="nav">
  <button class="nbtn on" id="nb-time" onclick="showSection('time',this)">📊 Time</button>
  <button class="nbtn" id="nb-1a1" onclick="showSection('1a1',this)">🎯 Pauta 1:1</button>
  <button class="nbtn" id="nb-foco" onclick="showSection('foco',this)">📌 Foco da Semana</button>
  <div class="nav-right" id="navRight">—</div>
</div>

<div class="sbar"><div class="sdot"></div><span id="sTxt">Pronto · <span id="hdrCtx"></span></span></div>

<div class="content">

  <!-- ══ TIME ══ -->
  <div id="sec-time">
    <!-- projeção BRL + USD -->
    <div id="projCards" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px"></div>

    <!-- filtros BU -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;gap:5px">
        <button class="bu-filter-btn on" onclick="filtrarBU('todos',this)">Todos</button>
        <button class="bu-filter-btn" onclick="filtrarBU('MI',this)">MI</button>
        <button class="bu-filter-btn" onclick="filtrarBU('Obras',this)">Obras</button>
        <button class="bu-filter-btn" onclick="filtrarBU('ME',this)">ME</button>
      </div>
      <div id="statusBadges" style="display:flex;gap:6px"></div>
    </div>

    <!-- tabela de projeção por vendedor -->
    <div id="projTable" style="background:var(--white);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px"></div>

    <!-- detalhe expandido -->

// ── DIAGNÓSTICO EM CARDS ──
async function gerarDiagnostico(v,d,fat,meta,falta,dias,m,email){
  const slug=email.split('@')[0];
  const el=$('tab-diag-'+slug);if(!el)return;
  const waChats=d.waChats||[];
  const waPessoal=waChats.filter(c=>c.tom==='pessoal').length;
  const waComercial=waChats.filter(c=>c.tom==='comercial').length;
  const ligTexto=(d.ligacoes||[]).map(l=>`${l.hora} | ${l.tipo} | ${l.resultado} | ${l.duracao} | ${l.cliente}`).join('\n')||'Nenhuma';
  const waTexto=waChats.map(c=>`${c.hora} | ${c.contato} | ${c.tom==='pessoal'?'⚠ PESSOAL':'✓ '+c.tom} | "${c.msg}"`).join('\n')||'Não monitorado';
  const conv=CONVERSAO[email]||{};
  const diaAtual=new Date().getDate();
  const ctx=diaAtual<=8?'INÍCIO DE MÊS — foco em ritmo':diaAtual<=18?'MEIO DE MÊS — foco em conversão':'FIM DE MÊS — foco em fechamento';

  const prompt=`Analise ${v.nome} (BU ${v.bu}) — ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}.
CONTEXTO: ${ctx} (dia ${diaAtual})
FINANCEIRO: ${fmt(fat,m)} de ${fmt(meta,m)} (${Math.round(fat/meta*100)}%) — falta ${fmt(falta,m)} em ${dias} dias úteis — precisa ${conv.contatos_dia||'?'} contatos/dia
LIGAÇÕES HOJE (${d.ligHoje||0} total, ${d.ligAtend||0} atendidas, duração média ${d.ligDurMedia||'—'}):
${ligTexto}
WHATSAPP HOJE (${waChats.length} chats — ${waPessoal} pessoal, ${waComercial} comercial):
${waTexto}

Retorne APENAS este JSON sem markdown (cada texto: máximo 2 frases curtas):
{"ligacoes":{"sub":"X lig · Y atend","tags":["tag1","tag2"],"tagCores":["warn","ok"],"texto":"2 frases com cliente real"},"whatsapp":{"sub":"X chats · Y pessoal","tags":["tag1","tag2"],"tagCores":["red","ok"],"texto":"2 frases com mensagem real"},"diagnostico":{"pontos":["causa 1","causa 2","causa 3"],"texto":"1 frase resumo"},"acoes":{"itens":["ação 1","ação 2","ação 3"]},"pergunta":{"txt":"pergunta para 1:1","porque":"2 frases explicando por que essa pergunta"}}`;

  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,
        system:'Consultor Sabagram. RETORNE APENAS JSON VÁLIDO sem texto extra. Textos curtos.',
        messages:[{role:'user',content:prompt}]})});
    const data=await r.json();
    const buf=data.content?.map(b=>b.text||'').join('')||'';
    const fence='```';const clean=buf.split(fence+'json').join('').split(fence).join('').trim();
    const j=JSON.parse(clean);

    const tagCor=(c)=>c==='ok'?'background:#dcfce7;color:#166534':c==='warn'?'background:#fef3c7;color:#92400e':c==='red'?'background:#fee2e2;color:#991b1b':'background:var(--s2);color:var(--muted)';
    const borderCor=(tipo)=>tipo==='ligacoes'?'#d97706':tipo==='whatsapp'?'#dc2626':tipo==='diagnostico'?'#185fa5':'#16a34a';
    const iconCor=(tipo)=>tipo==='ligacoes'?'☎':tipo==='whatsapp'?'💬':tipo==='diagnostico'?'🔍':'🎯';
    const bgIcon=(tipo)=>tipo==='ligacoes'?'background:#fef3c7':tipo==='whatsapp'?'background:#fee2e2':tipo==='diagnostico'?'background:#e6f1fb':'background:#dcfce7';

    let html=`<div class="diag-grid">`;
    // Card ligações
    html+=`<div class="diag-card" style="border-color:${borderCor('ligacoes')}">
      <div class="diag-hdr"><div class="diag-icon" style="${bgIcon('ligacoes')}">${iconCor('ligacoes')}</div><div><div class="diag-title">Qualidade das ligações</div><div class="diag-sub">${j.ligacoes.sub}</div></div></div>
      <div class="diag-tags">${(j.ligacoes.tags||[]).map((t,i)=>`<span class="diag-tag" style="${tagCor((j.ligacoes.tagCores||[])[i])}">${t}</span>`).join('')}</div>
      <div class="diag-txt">${j.ligacoes.texto}</div>
    </div>`;
    // Card WA
    html+=`<div class="diag-card" style="border-color:${borderCor('whatsapp')}">
      <div class="diag-hdr"><div class="diag-icon" style="${bgIcon('whatsapp')}">${iconCor('whatsapp')}</div><div><div class="diag-title">Comportamento no WhatsApp</div><div class="diag-sub">${j.whatsapp.sub}</div></div></div>
      <div class="diag-tags">${(j.whatsapp.tags||[]).map((t,i)=>`<span class="diag-tag" style="${tagCor((j.whatsapp.tagCores||[])[i])}">${t}</span>`).join('')}</div>
      <div class="diag-txt">${j.whatsapp.texto}</div>
    </div>`;
    // Card diagnóstico
    html+=`<div class="diag-card" style="border-color:${borderCor('diagnostico')}">
      <div class="diag-hdr"><div class="diag-icon" style="${bgIcon('diagnostico')}">${iconCor('diagnostico')}</div><div class="diag-title">Diagnóstico</div></div>
      <div class="diag-txt" style="margin-bottom:7px">${j.diagnostico.texto}</div>
      ${(j.diagnostico.pontos||[]).map((p,i)=>`<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px"><span class="diag-num" style="flex-shrink:0">${i+1}</span><span class="diag-txt">${p}</span></div>`).join('')}
    </div>`;
    // Card ações
    html+=`<div class="diag-card" style="border-color:${borderCor('acoes')}">
      <div class="diag-hdr"><div class="diag-icon" style="${bgIcon('acoes')}">${iconCor('acoes')}</div><div class="diag-title">Ações — esta semana</div></div>
      ${(j.acoes.itens||[]).map((item,i)=>`<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:5px"><span class="diag-num">${i+1}</span><span class="diag-txt">${item}</span></div>`).join('')}
    </div>`;
    html+=`</div>`;
    // Card 1:1 full width
    html+=`<div class="diag-card" style="border-color:var(--navy);border-radius:10px">
      <div class="diag-hdr"><div class="diag-icon" style="background:var(--s2)">💬</div><div class="diag-title">Pergunta para o 1:1</div></div>
      <div class="pergunta-box">
        <div class="pergunta-txt">${j.pergunta.txt}</div>
        <div class="pergunta-why-lbl">Por que essa pergunta</div>
        <div class="pergunta-why">${j.pergunta.porque}</div>
      </div>
    </div>`;
    el.innerHTML=html;
  }catch(e){
    el.innerHTML=`<span style="color:var(--red);font-size:12px">Erro: ${e.message}</span>`;
  }
}

// ── ATIVIDADES 2 COLUNAS ──
function renderAtividades(d,v){
  const ligs=d.ligacoes||[];
  const was=d.waChats||[];
  const ligAtend=ligs.filter(l=>l.resultado==='Atendeu').length;
  const waPessoal=was.filter(c=>c.tom==='pessoal').length;

  const corLig=r=>r==='Atendeu'?'#16a34a':'#dc2626';
  const bgLig=r=>r==='Atendeu'?'#dcfce7;color:#166534':'#fee2e2;color:#991b1b';
  const corWA=t=>t==='pessoal'?'#d97706':t==='comercial'?'#16a34a':'#185fa5';
  const bgWA=t=>t==='pessoal'?'#fef3c7;color:#92400e':t==='comercial'?'#dcfce7;color:#166534':'var(--s2);color:var(--muted)';
  const lblWA=t=>t==='pessoal'?'⚠ pessoal':t==='comercial'?'✓ comercial':'logística';

  let html=`<div class="atv-grid">`;
  // Coluna ligações
  html+=`<div><div class="atv-col-title">☎ Ligações · ${ligs.length} total · ${ligAtend} atendidas</div>`;
  if(!ligs.length)html+=`<div style="color:var(--muted);font-size:12px;padding:10px 0">Nenhuma ligação registrada hoje.</div>`;
  ligs.forEach(l=>{
    html+=`<div class="atv-item" style="border-color:${corLig(l.resultado)}">
      <div class="atv-top">
        <div>
          <div class="atv-nome">${l.cliente||l.tipo}</div>
          <span class="atv-badge" style="background:${bgLig(l.resultado)}">${l.tipo} · ${l.resultado}${l.duracao&&l.duracao!=='—'?' · '+l.duracao:''}</span>
        </div>
        <div class="atv-hora">${l.hora}</div>
      </div>
      <div class="atv-txt">${l.resumo||''}</div>
    </div>`;
  });
  html+=`</div>`;
  // Coluna WA
  html+=`<div><div class="atv-col-title">💬 WhatsApp · ${was.length} chats${waPessoal>0?' · ⚠ '+waPessoal+' pessoal':''}</div>`;
  if(!was.length)html+=`<div style="color:var(--muted);font-size:12px;padding:10px 0">${v&&v.whatsapp?'Nenhum chat ativo hoje.':'WA não monitorado para este vendedor.'}</div>`;
  was.forEach(c=>{
    html+=`<div class="atv-item" style="border-color:${corWA(c.tom)}">
      <div class="atv-top">
        <div>
          <div class="atv-nome">${c.contato}</div>
          ${c.empresa?`<div style="font-size:10px;font-weight:600;color:var(--navy);margin-top:1px;text-transform:uppercase;letter-spacing:.03em">${c.empresa}</div>`:''} 
          <span class="atv-badge" style="background:${bgWA(c.tom)}">${lblWA(c.tom)}</span>
        </div>
        <div class="atv-hora">${c.hora}</div>
      </div>
      <div class="atv-txt">"${c.msg}"</div>
    </div>`;
  });
  html+=`</div></div>`;
  return html;
}

function _projCalc(moeda){
  const vds=VENDEDORES.filter(v=>v.moeda===moeda);
  const fat=vds.reduce((s,v)=>s+(DADOS[v.email]?.fat||0),0);
  const meta=vds.reduce((s,v)=>s+(v.meta||0),1);
  const diaAtual=new Date().getDate();
  const diasTotais=22;
  const diasRestantes=Math.max(1,diasTotais-diaAtual);
  const projetado=Math.round(fat/Math.max(1,diaAtual)*diasTotais);
  const pctProj=Math.min(200,Math.round(projetado/meta*100));
  const ritmoAtual=Math.round(fat/Math.max(1,diaAtual));
  const ritmoNec=Math.round((meta-fat)/diasRestantes);
  return{fat,meta,projetado,pctProj,ritmoAtual,ritmoNec,diasRestantes};
}

function _veredicto(pctProj,ritmoAtual,ritmoNec,m){
  if(pctProj>=90)return{txt:'No ritmo',sub:'Manter cadência',cor:'#16a34a',bg:'#f0fdf4',brd:'#bbf7d0'};
  if(pctProj>=60)return{txt:'Sprint',sub:`+${fmt(ritmoNec-ritmoAtual,m)}/dia`,cor:'#d97706',bg:'#fef3c7',brd:'#fde68a'};
  if(pctProj>=25)return{txt:'Intervenção',sub:`+${fmt(ritmoNec-ritmoAtual,m)}/dia`,cor:'#dc2626',bg:'#fee2e2',brd:'#fca5a5'};
  return{txt:'Meta inatingível',sub:'Revisar pipeline',cor:'#7f1d1d',bg:'#fef2f2',brd:'#fca5a5'};
}

let _1a1Loaded=false;

async function carregarSec1a1(){
  if(_1a1Loaded)return;
  const el=$('conteudo-1a1');
  if(!el)return;
  const hoje=new Date().toISOString().slice(0,10);
  try{
    const token=await auth.currentUser?.getIdToken();
    if(!token)throw new Error('Sem token');
    const resultados=await Promise.all(VENDEDORES.map(async v=>{
      try{
        const emailKey=v.email.toLowerCase().replace(/[@.]/g,'_');
        const r=await fetch(`/api/fila?email=${emailKey}&data=${hoje}`,{headers:{Authorization:`Bearer ${token}`}});
        const data=await r.json();
        const filaItems=data.fila||[];
        return{v,dados:DADOS[v.email]||{},conv:CONVERSAO[v.email]||{},
          filaStats:{total:filaItems.length,contatados:filaItems.filter(c=>c.contatado).length,carteiraSummary:data.carteiraSummary||null}};
      }catch(err){
        return{v,dados:DADOS[v.email]||{},conv:CONVERSAO[v.email]||{},filaStats:{total:0,contatados:0,carteiraSummary:null}};
      }
    }));
    const diags=resultados.map(({v,dados,conv,filaStats})=>computarDiag1a1(v,dados,conv,filaStats));
    diags.sort((a,b)=>b.urgencia-a.urgencia);
    el.innerHTML=render1a1HTML(diags);
    _1a1Loaded=true;
  }catch(e){
    el.innerHTML=`<div style="color:var(--red);padding:20px;font-size:12px">Erro ao carregar: ${e.message}</div>`;
  }
}

function computarDiag1a1(v,dados,conv,filaStats){
  const fat=dados.fat||0;
  const meta=dados.meta||v.meta||1;
  const pct=fat/meta*100;
  const clientes7d=v.clientes7d||0;
  const lig7d=v.lig7d||0;
  const waChats7d=v.waChats7d||0;
  const contatos7d=lig7d+Math.floor(waChats7d/2);
  const taxaConv7d=contatos7d>0?(clientes7d/contatos7d*100):0;
  const filaPct=filaStats.total>0?(filaStats.contatados/filaStats.total*100):-1;
  const inativ60=filaStats.carteiraSummary?.inativos?.d60||0;
  const inativ90=filaStats.carteiraSummary?.inativos?.d90||0;
  const inativ120=filaStats.carteiraSummary?.inativos?.d120||0;
  const inativTotal=inativ60+inativ90+inativ120;
  const diaAtual=new Date().getDate();
  const ritmoEsperado=Math.min(100,diaAtual/22*100);
  const atraso=ritmoEsperado-pct;
  const metrics={fat,meta,pct,clientes7d,lig7d,waChats7d,contatos7d,taxaConv7d,
    filaPct,filaTotal:filaStats.total,filaContatados:filaStats.contatados,
    inativ60,inativ90,inativ120,inativTotal,ritmoEsperado,atraso,conv,moeda:v.moeda};
  let tipo,urgencia;
  if(filaPct>=0&&filaPct<50&&filaStats.total>=3){
    tipo='DISCIPLINA';urgencia=atraso>15?3:2;
  }else if(contatos7d<8&&v.bu!=='ME'){
    tipo='VOLUME';urgencia=atraso>10?3:2;
  }else if(taxaConv7d>0&&taxaConv7d<10&&contatos7d>=8){
    tipo='CONVERSÃO';urgencia=atraso>10?3:2;
  }else if(inativ120>2){
    tipo='CARTEIRA';urgencia=2;
  }else if(atraso>10){
    tipo='RITMO';urgencia=2;
  }else{
    tipo='AVIÃO';urgencia=1;
  }
  if(pct===0&&ritmoEsperado>20){urgencia=3;if(tipo==='AVIÃO')tipo='RITMO';}
  return{v,dados,conv,metrics,tipo,urgencia,pct,fat,meta};
}

      numDiag:m=>`${m.contatos7d} contatos em 7 dias`,
      contexto:m=>`${m.lig7d} lig + ${m.waChats7d} WA · meta: ${(m.conv?.contatos_dia||10)}×5 dias`,
      pergunta:()=>'"O que está tomando o seu tempo no lugar das ligações?"',
      cobrar:m=>`Mínimo ${m.conv?.contatos_dia||10} contatos por dia pelos próximos 10 dias.`,
      orientar:()=>'Sua conversão está boa — o motor está parado. Você já sabe fechar. Falta volume para criar as oportunidades.',
      impacto:()=>'Dobrar volume com mesma conversão = dobrar pedidos. Meta ao alcance sem mudar nada além da frequência.'},
    'CONVERSÃO':{cor:'#d97706',bg:'#fffbeb',brd:'#fde68a',icon:'📉',label:'CONVERSÃO BAIXA',
      numDiag:m=>`Conversão 7d: ${Math.round(m.taxaConv7d)}%`,

async function carregarDadosReais(){
  const hoje=new Date().toISOString().slice(0,10);
  const ontem=new Date(Date.now()-86400000).toISOString().slice(0,10);
  // Desempenho (fat mensal, pedidos, metaMensal por vendedor)
  try{
    let snap=await getDoc(doc(db,'contexto',`desempenho_${hoje}`));
    if(!snap.exists())snap=await getDoc(doc(db,'contexto',`desempenho_${ontem}`));
    if(snap.exists()){
      const vds=snap.data().vendedores||{};
      for(const v of VENDEDORES){
        const fsEmail=v.firestoreEmail||v.email;
        const vd=vds[fsEmail];
        if(!vd)continue;
        if(vd.mesAtual?.faturamento!==undefined)DADOS[v.email].fat=vd.mesAtual.faturamento;
        if(vd.mesAtual?.pedidos!==undefined)DADOS[v.email].clientes=vd.mesAtual.pedidos;
        if(vd.metaMensal){v.meta=vd.metaMensal;DADOS[v.email].meta=vd.metaMensal;}
      }
    }
  }catch(e){console.warn('desempenho:',e.message);}
  // Ligações do dia (total e atendidas por vendedor)
  try{
    const ligSnap=await getDoc(doc(db,'contexto',`ligacoes_${hoje}`));
    if(ligSnap.exists()){
      const regs=ligSnap.data().registros||[];
      for(const v of VENDEDORES){
        if(!v.sfUserId)continue;
        const vLigs=regs.filter(l=>(l.OwnerId||l.ownerId||'')===v.sfUserId);
        if(!vLigs.length)continue;
        DADOS[v.email].ligHoje=vLigs.length;
        DADOS[v.email].ligAtend=vLigs.filter(l=>{
          const s=l.Subject||l.subject||'';
          return s.includes('Atendida')&&!s.includes('Não Atendida');
        }).length;
      }
    }
  }catch(e){console.warn('ligacoes:',e.message);}
}

// ── FOCO DA SEMANA ──
let _focoLoaded=false;

async function carregarSecFoco(){
  if(_focoLoaded)return;
  const el=$('conteudo-foco');if(!el)return;
  const historico=await buscarHistorico3Meses();
  el.innerHTML=renderFocoHTML(historico);
  _focoLoaded=true;
}

async function buscarHistorico3Meses(){
  const resultado=[];
  const hoje=new Date();
  const mesesDef=[
    {label:'Junho (parcial)',key:hoje.toISOString().slice(0,10),fallback:new Date(Date.now()-86400000).toISOString().slice(0,10)},
    {label:'Maio',key:`${hoje.getFullYear()}-05-31`,fallback:`${hoje.getFullYear()}-05-30`},
    {label:'Abril',key:`${hoje.getFullYear()}-04-30`,fallback:`${hoje.getFullYear()}-04-29`},
  ];
  for(const mes of mesesDef){
    try{
      let snap=await getDoc(doc(db,'contexto',`desempenho_${mes.key}`));
      if(!snap.exists())snap=await getDoc(doc(db,'contexto',`desempenho_${mes.fallback}`));
      if(snap.exists()){
        const vds=snap.data().vendedores||{};
        let fatBRL=0,metaBRL=0,fatUSD=0,metaUSD=0;
        for(const v of VENDEDORES){
          const fsEmail=v.firestoreEmail||v.email;
          const vd=vds[fsEmail];if(!vd)continue;
          const fat=vd.mesAtual?.faturamento||0;
          const meta=vd.metaMensal||v.meta||0;
          if(v.moeda==='USD'){fatUSD+=fat;metaUSD+=meta;}else{fatBRL+=fat;metaBRL+=meta;}
        }
        resultado.push({label:mes.label,fatBRL,metaBRL,fatUSD,metaUSD,ok:true});
      }else{resultado.push({label:mes.label,ok:false});}
    }catch(e){resultado.push({label:mes.label,ok:false});}
  }
  return resultado;
}

        <div style="font-size:11px;color:var(--muted)">O que fazer esta semana para mover o time — ordenado por urgência</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        ${totalUrgentes>0?`<span style="background:#fee2e2;color:#dc2626;border:0.5px solid #fca5a5;font-size:10px;font-weight:700;padding:3px 10px;border-radius:5px">🚨 ${totalUrgentes} urgente${totalUrgentes>1?'s':''}</span>`:''}
        ${totalAtencao>0?`<span style="background:#fef3c7;color:#d97706;border:0.5px solid #fde68a;font-size:10px;font-weight:700;padding:3px 10px;border-radius:5px">⚠️ ${totalAtencao} atenção</span>`:''}
      </div>
    </div>

    <div style="background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">⚡ Prioridades desta semana</div>
      ${priorItems}
    </div>

    <div style="background:var(--navy);border-radius:12px;padding:16px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px">📅 Pauta da reunião de time</div>
      <div style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:10px">Duração sugerida: ${pautaItens.reduce((s,i)=>s+parseInt(i.t),0)} min · use como roteiro, não script</div>
      ${pautaHTML}
    </div>

    <div style="background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:16px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">📊 Retrospectiva — últimos 3 meses</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${histHTML}</div>
    </div>
  </div>`;
}

async function iniciar(){
  const dias=diasUteis();
  const diaAtual=new Date().getDate();
  const ctx=diaAtual<=8?'🟡 Início de mês':diaAtual<=18?'🔵 Meio de mês':'🔴 Fim de mês';
  $('hdrCtx').textContent=ctx+' · '+dias+' dias úteis restantes';
  $('navRight').textContent='Carregando...';
  renderTimeSection();renderProjTable();
  await carregarDadosReais();
  $('navRight').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  renderTimeSection();renderProjTable();
}
</script>
</body>
</html>
