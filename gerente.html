<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabagram · Gerencial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3254;--gold:#c8960a;--gold-l:#e0aa18;
  --bg:#f4f6f9;--white:#fff;--s2:#f8f9fc;
  --border:#e2e7ef;--text:#1a2540;--text2:#3d5073;--muted:#7589a8;--dim:#a8b8cf;
  --red:#c0392b;--rbg:rgba(192,57,43,.07);--rbd:rgba(192,57,43,.2);
  --amber:#d97706;--abg:rgba(217,119,6,.07);--abd:rgba(217,119,6,.2);
  --green:#1a7a4a;--gbg:rgba(26,122,74,.07);--gbd:rgba(26,122,74,.2);
  --blue:#1e5fa0;--bbg:rgba(30,95,160,.07);--bbd:rgba(30,95,160,.2);
  --r:10px;--shadow:0 1px 3px rgba(26,50,84,.08),0 4px 12px rgba(26,50,84,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.hdr{background:var(--navy);height:56px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(26,50,84,.25)}
.hdr-l{display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:15px;color:white;letter-spacing:.04em}
.logo span{color:var(--gold-l)}
.hsep{width:1px;height:18px;background:rgba(255,255,255,.15)}
.hdr-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:10px;font-weight:700;padding:3px 10px;border-radius:5px;letter-spacing:.06em}
.hdr-r{display:flex;align-items:center;gap:10px}
#clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.4)}
.btn-sm{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .15s}
.btn-sm:hover{background:rgba(255,255,255,.18)} .btn-sm:disabled{opacity:.4;cursor:not-allowed}
.btn-sair{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn-sair:hover{background:rgba(255,255,255,.15);color:white}
.sbar{background:white;border-bottom:1px solid var(--border);padding:6px 28px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sdot.on{background:var(--amber);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
.page-hdr{margin-bottom:20px}
.page-date{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
.page-title span{color:var(--navy)}

/* BU SECTIONS */
.bu-section{margin-bottom:28px}
.bu-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.bu-title{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.bu-badge{background:var(--navy);color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.bu-badge.usd{background:#1a5f3a}
.bu-badge.obras{background:#5f3a1a}
.bu-stats{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);display:flex;gap:16px}

/* GRID VENDEDORES */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

/* CARD */
.vcard{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.vcard-hdr{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:white;flex-shrink:0}
.vcard-info{flex:1}
.vcard-nome{font-size:13px;font-weight:800;margin-bottom:1px}
.vcard-sub{font-size:10px;color:var(--muted)}
.status-tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.st-c{background:var(--rbg);color:var(--red);border:1px solid var(--rbd)}
.st-a{background:var(--abg);color:var(--amber);border:1px solid var(--abd)}
.st-b{background:var(--bbg);color:var(--blue);border:1px solid var(--bbd)}
.st-g{background:var(--gbg);color:var(--green);border:1px solid var(--gbd)}

.vcard-body{padding:14px 16px}
.vmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.vm{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.vm-v{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:1px;font-family:'JetBrains Mono',monospace}
.vm-l{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.07em;text-transform:uppercase}
.prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:8px 0 3px}
.prog-fill{height:4px;border-radius:2px;transition:width .8s}
.prog-lbl{font-size:9px;color:var(--muted);text-align:right;font-family:'JetBrains Mono',monospace}

/* IA */
.ia-wrap{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.ia-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ia-badge{background:var(--navy);color:white;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;display:flex;align-items:center;gap:3px}
.ia-dot{width:4px;height:4px;border-radius:50%;background:var(--gold-l)}
.ia-dot.on{animation:blink 1s infinite}
.ia-lbl{font-size:11px;font-weight:600;color:var(--muted)}
.ia-body{font-size:12px;line-height:1.8;color:var(--text2)}
.ia-body p{margin-bottom:7px} .ia-body p:last-child{margin-bottom:0}
.ia-body strong{color:var(--text);font-weight:700}
.ia-body h3{font-size:11px;font-weight:800;color:var(--text);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.04em}
.spin-sm{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.spinner-sm{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite}

/* CONSOLIDADO */
.consolid{background:var(--navy);border-radius:12px;padding:16px 22px;margin-bottom:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cv{font-size:20px;font-weight:800;color:white;letter-spacing:-.4px;line-height:1;margin-bottom:2px}
.cv.gold{color:var(--gold-l)} .cv.red{color:#ff8a80}
.cl{font-size:9px;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:.07em;text-transform:uppercase}
.cs{font-size:10px;color:rgba(255,255,255,.28);margin-top:1px;font-family:'JetBrains Mono',monospace}

.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:white;border-radius:var(--r);padding:9px 15px;font-size:12px;font-weight:600;transform:translateY(60px);opacity:0;transition:all .25s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}
.topbar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--gold));transform:scaleX(0);transform-origin:left;z-index:999;transition:transform .4s}
.topbar.on{transform:scaleX(.85)} .topbar.done{transform:scaleX(1);opacity:0;transition:opacity .5s}
@media(max-width:768px){.consolid{grid-template-columns:1fr 1fr}.v-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<header class="hdr">
  <div class="hdr-l">
    <div class="logo">SABA<span>GRAM</span></div>
    <div class="hsep"></div>
    <div class="hdr-badge" id="hdrBadge">VISÃO GERENCIAL</div>
  </div>
  <div class="hdr-r">
    <div id="clock"></div>
    <button class="btn-sm" id="btnR" onclick="carregarTudo()"><span id="btnIcon">↻</span> Atualizar</button>

<div class="wrap">

  <div class="consolid">

    <div><div class="cv" id="cMetaBRL">—</div><div class="cl">Meta BRL</div><div class="cs">BU MI + Obras</div></div>
    <div><div class="cv" id="cMetaUSD">—</div><div class="cl">Meta USD</div><div class="cs">BU ME</div></div>

    <div class="v-grid" id="gridMI"></div>

  <div class="bu-section">

      <div class="bu-stats" id="statsObras">—</div>
    </div>
    <div class="v-grid" id="gridObras"></div>
  </div>

  <!-- BU ME -->
  <div class="bu-section">
    <div class="bu-header">
      <div class="bu-title"><span class="bu-badge usd">BU ME</span> Mercado Externo (USD)</div>
      <div class="bu-stats" id="statsME">—</div>
    </div>
    <div class="v-grid" id="gridME"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FIREBASE_CONFIG = {
  apiKey:"AIzaSyC6oWnbIyaZejwtNcL2S0SrHKLlLLxzUfI",
  authDomain:"sales-team-6aeb6.firebaseapp.com",
  projectId:"sales-team-6aeb6",
  storageBucket:"sales-team-6aeb6.firebasestorage.app",
  messagingSenderId:"421701680094",
  appId:"1:421701680094:web:1f8bc4ae716dd0d0f3bb4f"
};

// TODOS OS VENDEDORES
const VENDEDORES = [
  // BU MI
  { email:"sizenando@sabagram.com.br", nome:"Sizenando Andrade", avatar:"SA", bu:"MI",  moeda:"BRL", cor:"#1a3254", ideVen:["001TW000003LbquYAC","001TW000003LcYSYA0"], userId:"005TW0000002BnNYAU", meta:233289 },
  { email:"kelly@sabagram.com.br",     nome:"Kelly Julião",      avatar:"KJ", bu:"MI",  moeda:"BRL", cor:"#1a5f3a", ideVen:["001TW000005ag14YAA","001TW000005ah3ZYAQ"], userId:"005TW0000003rpNYAQ", meta:161563 },
  { email:"marcelo@sabagram.com.br",   nome:"Marcelo Melo",      avatar:"MM", bu:"MI",  moeda:"BRL", cor:"#8b1a1a", ideVen:["0014S00000BK1xDQAT"],                       userId:"0054S000002TkpGQAS", meta:463680 },
  { email:"renata@sabagram.com.br",    nome:"Renata Santana",    avatar:"RS", bu:"MI",  moeda:"BRL", cor:"#6b1a5f", ideVen:["001TW00000Buxa9YAB","001TW00000BusqcYAB","001TW00000C09VzYAJ"], userId:"005TW000000ANTBYA4", meta:105777 },
  // BU Obras
  { email:"wesley@sabagram.com.br",    nome:"Wesley Matieli",    avatar:"WM", bu:"Obras", moeda:"BRL", cor:"#1a4a2a", ideVen:["0014S00000Br0ySQAR"],                   userId:"005TW000000C7AbYAK", meta:172431 },
  // BU ME
  { email:"cezar@sabagram.com.br",     nome:"Cezar Fiorio",      avatar:"CF", bu:"ME",  moeda:"USD", cor:"#1a3a6b", ideVen:["0014S00000BK1xDQAT"],                       userId:"005TW000000APunYAG", meta:172800 },
  { email:"diana@sabagram.com.br",     nome:"Diana Rigoni",      avatar:"DR", bu:"ME",  moeda:"USD", cor:"#5f1a4a", ideVen:["001TW00000AooaAYAR"],                       userId:"0054S000002TkpZQAS", meta:25000  },
];

const USUARIOS_AUTH = {
  "henrique@sabagram.com.br":{perfil:"admin"},
  "dhiego@sabagram.com.br":{perfil:"gerente"},
};
VENDEDORES.forEach(v=>{ USUARIOS_AUTH[v.email]={perfil:"vendedor"}; });

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
let gerente = null;

onAuthStateChanged(auth, async user => {
  if(!user){window.location.href='index.html';return;}
  const email = user.email.toLowerCase();
  const u = USUARIOS_AUTH[email];
  if(!u||(u.perfil!=='gerente'&&u.perfil!=='admin')){await signOut(auth);window.location.href='index.html';return;}
  gerente = {email, nome: email.includes('henrique')?'Henrique':'Dhiego'};
  document.getElementById('gNome').textContent = gerente.nome.split(' ')[0];
  document.getElementById('pageDate').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
  if(u.perfil==='admin') document.getElementById('hdrBadge').textContent='ADMIN';
  carregarTudo();
});

window.sair = async () => { await signOut(auth); window.location.href='index.html'; };

const $ = id => document.getElementById(id);
const fmt = (v,m='BRL') => m==='USD' ? 'US$'+Math.round(v/1000)+'k' : 'R$'+Math.round(v/1000)+'k';
const fmtK = (v,m='BRL') => m==='USD' ? 'US$'+Math.round(v) : 'R$'+Math.round(v/1000)+'k';
const setStatus = (txt,on=false) => { $('sTxt').textContent=txt; $('sDot').className='sdot'+(on?' on':''); };
const diasUteis = () => {
  const h=new Date(),f=new Date(h.getFullYear(),h.getMonth()+1,0);
  let c=0,d=new Date(h);d.setDate(d.getDate()+1);
  while(d<=f){if(d.getDay()!==0&&d.getDay()!==6)c++;d.setDate(d.getDate()+1);}
  return c;
};
const tick=()=>$('clock').textContent=new Date().toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).toUpperCase();
tick();setInterval(tick,30000);

const md2html = t => t
  .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
  .replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
  .replace(/^##\s+(.+)$/gm,'<h3>$1</h3>')
  .replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');

async function apiClaude(prompt) {
  const r = await fetch('/api/claude',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-haiku-4-5-20251001', max_tokens:1200,
      mcp_servers:[{type:'url',url:'https://api.salesforce.com/platform/mcp/v1/platform/sobject-all',name:'salesforce'}],
      system:`Consultor de alta performance comercial analisando equipe da Sabagram (granitos/mármores, ES).
Data: ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} | Dias úteis restantes: ${diasUteis()}
Seja direto, específico, acionável. Use dados reais. Português.`,
      messages:[{role:'user',content:prompt}]
    })
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  return d.content?.map(b=>b.text||'').join('')||'';
}

async function buscarDadosVendedor(v) {
  const mesAtual = new Date().toISOString().slice(0,7)+'-01';
  let fat=0, clientes=0, ligHoje=0, ligAtend=0;
  try {
    let buf='';
    await (async()=>{
      const r = await fetch('/api/claude',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-haiku-4-5-20251001', max_tokens:200,
          mcp_servers:[{type:'url',url:'https://api.salesforce.com/platform/mcp/v1/platform/sobject-all',name:'salesforce'}],
          system:'Retorne apenas os dados solicitados sem explicação.',
          messages:[{role:'user',content:`Execute no Salesforce:
Query 1: SELECT SUM(VlrLiq__c) fat, COUNT_DISTINCT(IdeCli__c) cli FROM Pedido__c WHERE IdeVen__c IN ('${v.ideVen.join("','")}') AND StsPed__c='Faturado' AND DatFat__c >= ${mesAtual}
Query 2: SELECT COUNT(Id) total, CallDisposition FROM Task WHERE OwnerId='${v.userId}' AND ActivityDate=TODAY AND Type='Call' GROUP BY CallDisposition
Retorne APENAS:
FAT:XXXXX
CLI:X
LIG_TOTAL:X
LIG_ATEND:X`}]
        })
      });
      const data = await r.json();
      buf = data.content?.map(b=>b.text||'').join('')||'';
    })();
    const fm=buf.match(/FAT[:\s]+(\d+(?:[.,]\d+)?)/);
    const cm=buf.match(/CLI[:\s]+(\d+)/);
    const lm=buf.match(/LIG_TOTAL[:\s]+(\d+)/);
    const la=buf.match(/LIG_ATEND[:\s]+(\d+)/);
    fat=fm?parseFloat(fm[1].replace(',','.')):0;
    clientes=cm?parseInt(cm[1]):0;
    ligHoje=lm?parseInt(lm[1]):0;
    ligAtend=la?parseInt(la[1]):0;
  } catch {}
  return {fat, clientes, ligHoje, ligAtend};
}

function getStatus(fat, meta, ligHoje) {
  const pct = meta>0?fat/meta*100:0;
  if(pct<5&&ligHoje<3) return {cls:'st-c',txt:'🔴 CRÍTICO'};
  if(pct<20||ligHoje<5) return {cls:'st-a',txt:'🟡 ALERTA'};
  if(pct<50) return {cls:'st-b',txt:'🔵 EM PROGRESSO'};
  return {cls:'st-g',txt:'✅ NO CAMINHO'};
}

function renderCard(v, d) {
  const pct = Math.min(100,Math.round(d.fat/v.meta*100));
  const falta = v.meta - d.fat;
  const dias = diasUteis();
  const corP = pct<10?'var(--red)':pct<40?'var(--amber)':'var(--green)';
  const st = getStatus(d.fat, v.meta, d.ligHoje);
  const m = v.moeda;

  return `<div class="vcard" id="card-${v.avatar}">
    <div class="vcard-hdr">
      <div class="avatar" style="background:${v.cor}">${v.avatar}</div>
      <div class="vcard-info">
        <div class="vcard-nome">${v.nome}</div>
        <div class="vcard-sub">${v.bu==='ME'?'BU ME · '+m:'BU '+v.bu+' · '+m} · Meta ${fmt(v.meta,m)}</div>
      </div>
      <span class="status-tag ${st.cls}">${st.txt}</span>
    </div>
    <div class="vcard-body">
      <div class="vmetrics">
        <div class="vm"><div class="vm-v" style="color:var(--navy)">${fmt(d.fat,m)}</div><div class="vm-l">Faturado</div></div>
        <div class="vm"><div class="vm-v" style="color:${corP}">${pct}%</div><div class="vm-l">Atingido</div></div>
        <div class="vm"><div class="vm-v" style="color:var(--red)">${fmt(falta,m)}</div><div class="vm-l">Falta</div></div>
        <div class="vm"><div class="vm-v" style="color:${d.ligHoje>=8?'var(--green)':d.ligHoje>=4?'var(--amber)':'var(--red)'}">${d.ligHoje}</div><div class="vm-l">Lig. hoje</div></div>
        <div class="vm"><div class="vm-v" style="color:var(--text2)">${d.clientes}</div><div class="vm-l">Clientes</div></div>
        <div class="vm"><div class="vm-v" style="color:var(--text2)">${fmtK(Math.round(falta/Math.max(dias,1)),m)}</div><div class="vm-l">Falta/dia</div></div>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${pct}%;background:${corP}"></div></div>
      <div class="prog-lbl">${pct}% · ${dias} dias úteis restantes</div>
      <div class="ia-wrap">
        <div class="ia-hdr">
          <div class="ia-badge"><div class="ia-dot on" id="dot-${v.avatar}"></div>IA</div>
          <div class="ia-lbl">Diagnóstico + plano de ação</div>
        </div>
        <div class="ia-body" id="ia-${v.avatar}">
          <div class="spin-sm"><div class="spinner-sm"></div> Analisando...</div>
        </div>
      </div>
    </div>
  </div>`;
}

async function gerarAnalise(v, d) {
  const el = $('ia-'+v.avatar);
  const dot = $('dot-'+v.avatar);
  if(!el) return;
  const pct = v.meta>0?Math.round(d.fat/v.meta*100):0;
  const falta = v.meta - d.fat;
  const dias = diasUteis();
  const m = v.moeda;

  const prompt = `Analise ${v.nome} (${v.bu==='ME'?'Mercado Externo':'Mercado Interno'}) — Junho/2026.

DADOS REAIS:
- Faturado: ${fmt(d.fat,m)} de ${fmt(v.meta,m)} (${pct}%)
- Falta: ${fmt(falta,m)} em ${dias} dias úteis = ${fmtK(Math.round(falta/Math.max(dias,1)),m)}/dia útil
- Ligações hoje: ${d.ligHoje} (${d.ligAtend} atendidas)
- Clientes únicos no mês: ${d.clientes}

Busque no Salesforce as últimas 5 Tasks do vendedor (OwnerId: ${v.userId}) para enriquecer com dados reais de atividade.

Gere para o gerente Dhiego (máx 280 palavras):

### 🔍 Diagnóstico
O que está acontecendo. 2 frases diretas baseadas nos dados.

### 🚨 Problemas (2-3 itens)
Cada um: problema + impacto direto.

### 🎯 Ações para Dhiego (esta semana)
3 ações concretas e específicas para este vendedor agora.

### 💬 Pergunta para o 1:1
1 pergunta exata que revela a causa raiz e força comprometimento.`;

  try {
    const txt = await apiClaude(prompt);
    el.innerHTML = `<p>${md2html(txt)}</p>`;
    if(dot) dot.classList.remove('on');
  } catch(e) {
    el.innerHTML = `<span style="color:var(--red);font-size:11px;font-family:'JetBrains Mono',monospace">Erro: ${e.message}</span>`;
  }
}

window.carregarTudo = async () => {
  const btn=$('btnR'); btn.disabled=true; $('btnIcon').textContent='↻';
  $('topbar').className='topbar on';
  setStatus('Buscando dados do time...', true);
  const dias = diasUteis();
  $('cDias').textContent = dias;

  // Buscar dados de todos em paralelo
  const dados = {};
  await Promise.all(VENDEDORES.map(async v => {
    dados[v.email] = await buscarDadosVendedor(v);
  }));

  // Calcular consolidados por moeda
  let fatBRL=0, metaBRL=0, fatUSD=0, metaUSD=0;
  VENDEDORES.forEach(v => {
    const d = dados[v.email];
    if(v.moeda==='BRL'){ fatBRL+=d.fat; metaBRL+=v.meta; }
    else { fatUSD+=d.fat; metaUSD+=v.meta; }
  });
  $('cFatBRL').textContent = 'R$'+Math.round(fatBRL/1000)+'k';
  $('cFatUSD').textContent = 'US$'+Math.round(fatUSD/1000)+'k';
  $('cMetaBRL').textContent = 'R$'+Math.round(metaBRL/1000)+'k';
  $('cMetaUSD').textContent = 'US$'+Math.round(metaUSD/1000)+'k';

  // Renderizar por BU
  const mi    = VENDEDORES.filter(v=>v.bu==='MI');
  const obras = VENDEDORES.filter(v=>v.bu==='Obras');
  const me    = VENDEDORES.filter(v=>v.bu==='ME');

  const fatMI = mi.reduce((s,v)=>s+dados[v.email].fat,0);
  const metaMI = mi.reduce((s,v)=>s+v.meta,0);
  $('statsMI').textContent = `Faturado: R$${Math.round(fatMI/1000)}k / R$${Math.round(metaMI/1000)}k (${Math.round(fatMI/metaMI*100)}%)`;

  const fatObras = obras.reduce((s,v)=>s+dados[v.email].fat,0);
  const metaObras = obras.reduce((s,v)=>s+v.meta,0);
  $('statsObras').textContent = `Faturado: R$${Math.round(fatObras/1000)}k / R$${Math.round(metaObras/1000)}k (${Math.round(fatObras/metaObras*100)}%)`;

  const fatME = me.reduce((s,v)=>s+dados[v.email].fat,0);
  const metaME = me.reduce((s,v)=>s+v.meta,0);
  $('statsME').textContent = `Faturado: US$${Math.round(fatME/1000)}k / US$${Math.round(metaME/1000)}k (${Math.round(fatME/metaME*100)}%)`;

  $('gridMI').innerHTML    = mi.map(v=>renderCard(v,dados[v.email])).join('');
  $('gridObras').innerHTML  = obras.map(v=>renderCard(v,dados[v.email])).join('');
  $('gridME').innerHTML     = me.map(v=>renderCard(v,dados[v.email])).join('');

  setStatus('Gerando análises com IA...', true);

  // Análise IA em paralelo
  await Promise.all(VENDEDORES.map(v => gerarAnalise(v, dados[v.email])));

  const ts=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  setStatus(`Atualizado às ${ts}`, false);
  $('topbar').className='topbar done';
  setTimeout(()=>$('topbar').className='topbar',600);
  btn.disabled=false; $('btnIcon').textContent='↻';
};

setInterval(()=>{
  const h=new Date().getHours(),m=new Date().getMinutes();
  if((h===6||h===12)&&m<5) window.carregarTudo();
},60000);
</script>
