<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabagram · Gerencial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3254;--navy2:#1e3d65;--gold:#c8960a;--gold-l:#e0aa18;
  --bg:#f4f6f9;--white:#fff;--s2:#f8f9fc;
  --border:#e2e7ef;--border2:#d0d8e8;
  --text:#1a2540;--text2:#3d5073;--muted:#7589a8;--dim:#a8b8cf;
  --red:#c0392b;--rbg:rgba(192,57,43,.07);--rbd:rgba(192,57,43,.2);
  --amber:#d97706;--abg:rgba(217,119,6,.07);--abd:rgba(217,119,6,.2);
  --green:#1a7a4a;--gbg:rgba(26,122,74,.07);--gbd:rgba(26,122,74,.2);
  --blue:#1e5fa0;--bbg:rgba(30,95,160,.07);--bbd:rgba(30,95,160,.2);
  --r:10px;--shadow:0 1px 3px rgba(26,50,84,.08),0 4px 12px rgba(26,50,84,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.hdr{background:var(--navy);height:56px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(26,50,84,.25)}
.hdr-l{display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:15px;color:white;letter-spacing:.04em}
.logo span{color:var(--gold-l)}
.hsep{width:1px;height:18px;background:rgba(255,255,255,.15)}
.hdr-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:10px;font-weight:700;padding:3px 10px;border-radius:5px;letter-spacing:.06em}
.hdr-r{display:flex;align-items:center;gap:10px}
#clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.4)}
.btn-sm{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .15s}
.btn-sm:hover{background:rgba(255,255,255,.18)}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}
.btn-sair{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn-sair:hover{background:rgba(255,255,255,.15);color:white}
.sbar{background:white;border-bottom:1px solid var(--border);padding:6px 28px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sdot.on{background:var(--amber);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

/* LAYOUT */
.wrap{max-width:1100px;margin:0 auto;padding:24px 28px 60px}

/* HEADER RESUMO */
.page-hdr{margin-bottom:24px}
.page-date{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
.page-title span{color:var(--navy)}

/* CONSOLIDADO */
.consolid{background:var(--navy);border-radius:12px;padding:18px 24px;margin-bottom:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cons-v{font-size:22px;font-weight:800;color:white;letter-spacing:-.5px;line-height:1;margin-bottom:2px}
.cons-v.gold{color:var(--gold-l)}
.cons-v.red{color:#ff8a80}
.cons-l{font-size:9px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.07em;text-transform:uppercase}
.cons-s{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px;font-family:'JetBrains Mono',monospace}

/* CARDS VENDEDORES */
.vendedores-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.vcard{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.vcard-hdr{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.vcard-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:white;flex-shrink:0}
.vcard-info{flex:1}
.vcard-nome{font-size:14px;font-weight:800;margin-bottom:1px}
.vcard-cargo{font-size:10px;color:var(--muted)}
.vcard-body{padding:16px 18px}

/* MÉTRICAS DO VENDEDOR */
.vmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.vm{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.vm-v{font-size:16px;font-weight:800;letter-spacing:-.3px;margin-bottom:1px;font-family:'JetBrains Mono',monospace}
.vm-l{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.07em;text-transform:uppercase}
.prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:8px 0 4px}
.prog-fill{height:4px;border-radius:2px;transition:width .8s}
.prog-label{font-size:9px;color:var(--muted);text-align:right;font-family:'JetBrains Mono',monospace}

/* STATUS TAG */
.status-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;margin-bottom:12px}
.st-critico{background:var(--rbg);color:var(--red);border:1px solid var(--rbd)}
.st-alerta{background:var(--abg);color:var(--amber);border:1px solid var(--abd)}
.st-ok{background:var(--gbg);color:var(--green);border:1px solid var(--gbd)}

/* ANÁLISE IA */
.ia-section{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.ia-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ia-badge{background:var(--navy);color:white;font-size:9px;font-weight:700;letter-spacing:.07em;padding:2px 7px;border-radius:4px;display:flex;align-items:center;gap:4px}
.ia-pulse{width:5px;height:5px;border-radius:50%;background:var(--gold-l)}
.ia-pulse.on{animation:blink 1s infinite}
.ia-title{font-size:11px;font-weight:600;color:var(--muted)}
.ia-content{font-size:13px;line-height:1.85;color:var(--text2)}
.ia-content p{margin-bottom:8px}
.ia-content p:last-child{margin-bottom:0}
.ia-content strong{color:var(--text);font-weight:700}
.ia-content h3{font-size:12px;font-weight:800;color:var(--text);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}

/* ALERTA BOX */
.alert-box{border-radius:8px;padding:10px 13px;margin:8px 0;font-size:12px;line-height:1.6;font-weight:500}
.ab-r{background:var(--rbg);border:1px solid var(--rbd);color:var(--red)}
.ab-a{background:var(--abg);border:1px solid var(--abd);color:var(--amber)}
.ab-g{background:var(--gbg);border:1px solid var(--gbd);color:var(--green)}
.ab-b{background:var(--bbg);border:1px solid var(--bbd);color:var(--blue)}

/* PERGUNTA GERENTE */
.pergunta{background:var(--navy);color:rgba(255,255,255,.9);border-radius:8px;padding:10px 13px;margin:6px 0;font-size:12px;font-style:italic;line-height:1.6}
.pergunta-tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-l);margin-bottom:4px;font-style:normal}

/* CURSOR */
.cursor{display:inline-block;width:2px;height:13px;background:var(--navy);animation:blink .7s infinite;vertical-align:middle;margin-left:2px;border-radius:1px}

/* SPINNER */
.spin-wrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:8px 0}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:white;border-radius:var(--r);padding:9px 15px;font-size:12px;font-weight:600;transform:translateY(60px);opacity:0;transition:all .25s;z-index:999;box-shadow:var(--shadow)}
.toast.show{transform:translateY(0);opacity:1}
.topbar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--gold));transform:scaleX(0);transform-origin:left;z-index:999;transition:transform .4s}
.topbar.on{transform:scaleX(.85)}.topbar.done{transform:scaleX(1);opacity:0;transition:opacity .5s}

@media(max-width:768px){
  .vendedores-grid{grid-template-columns:1fr}
  .consolid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<header class="hdr">
  <div class="hdr-l">
    <div class="logo">SABA<span>GRAM</span></div>
    <div class="hsep"></div>
    <div class="hdr-badge" id="hdrBadge">VISÃO GERENCIAL</div>
  </div>
  <div class="hdr-r">
    <div id="clock"></div>
    <button class="btn-sm" id="btnRefresh" onclick="carregarTudo()"><span id="btnIcon">↻</span> Atualizar</button>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
</header>
<div class="sbar"><div class="sdot" id="sDot"></div><span id="sTxt">Inicializando...</span></div>

<div class="wrap">
  <div class="page-hdr">
    <div class="page-date" id="pageDate"></div>
    <div class="page-title">Bom dia, <span id="gNome">Dhiego</span>. Como está o time hoje.</div>
  </div>

  <!-- CONSOLIDADO -->
  <div class="consolid">
    <div><div class="cons-v gold" id="cFatTotal">—</div><div class="cons-l">Time faturado</div><div class="cons-s" id="cMes">junho/26</div></div>
    <div><div class="cons-v" id="cMetaTotal">—</div><div class="cons-l">Meta consolidada</div><div class="cons-s">BU MI</div></div>
    <div><div class="cons-v" id="cPct">—</div><div class="cons-l">Atingimento</div><div class="cons-s" id="cDias">— dias úteis</div></div>
    <div><div class="cons-v red" id="cFalta">—</div><div class="cons-l">Falta para meta</div><div class="cons-s" id="cPorDia">— por dia útil</div></div>
  </div>

  <!-- CARDS DOS VENDEDORES -->
  <div class="vendedores-grid" id="vendedoresGrid">
    <div class="spin-wrap"><div class="spinner"></div> Carregando dados...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// CONFIG INLINE
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyC6oWnbIyaZejwtNcL2S0SrHKLlLLxzUfI",
  authDomain:"sales-team-6aeb6.firebaseapp.com",
  projectId:"sales-team-6aeb6",
  storageBucket:"sales-team-6aeb6.firebasestorage.app",
  messagingSenderId:"421701680094",
  appId:"1:421701680094:web:1f8bc4ae716dd0d0f3bb4f"
};
const USUARIOS = {
  "henrique@sabagram.com.br":{nome:"Henrique Sabadine",perfil:"admin",avatar:"HS"},
  "dhiego@sabagram.com.br":{nome:"Dhiego Zanardi",perfil:"gerente",avatar:"DZ"},
  "sizenando@sabagram.com.br":{nome:"Sizenando Andrade",perfil:"vendedor",avatar:"SA",salesforce:{ideVen:["001TW000003LbquYAC","001TW000003LcYSYA0"],userId:"005TW0000002BnNYAU"},whatsapp:"5528999565519",cor:"#1a3254"},
  "kelly@sabagram.com.br":{nome:"Kelly Julião",perfil:"vendedor",avatar:"KJ",salesforce:{ideVen:["001TW000005ag14YAA","001TW000005ah3ZYAQ"],userId:"005TW0000003rpNYAQ"},whatsapp:"5528999688866",cor:"#1a5f3a"}
};
const API = { claude:"/api/claude", salesforce:"https://api.salesforce.com/platform/mcp/v1/platform/sobject-all", nitzap:"https://sabagram-mcp.nitzap.com/mcp/master" };

// DADOS REAIS JÁ BUSCADOS (atualizar via botão)
const DADOS_REAIS = {
  "sizenando@sabagram.com.br": { fat:7785.46, meta:233289, clientes:1, ligacoesHoje:3, ligacoesAtendidas:1, ligacoesMes:12, diasSemPedido:0, ultimoPedido:"03/06" },
  "kelly@sabagram.com.br":     { fat:4191.70, meta:161563, clientes:2, ligacoesHoje:0, ligacoesAtendidas:0, ligacoesMes:15, diasSemPedido:0, ultimoPedido:"02/06" }
};

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
let gerente = null;

const VENDEDORES = Object.entries(USUARIOS).filter(([,u])=>u.perfil==='vendedor').map(([email,u])=>({email,...u}));

onAuthStateChanged(auth, async user => {
  if(!user){window.location.href='index.html';return;}
  const u = USUARIOS[user.email.toLowerCase()];
  if(!u||(u.perfil!=='gerente'&&u.perfil!=='admin')){await signOut(auth);window.location.href='index.html';return;}
  gerente = {email:user.email,...u};
  document.getElementById('gNome').textContent = u.nome.split(' ')[0];
  document.getElementById('pageDate').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
  if(u.perfil==='admin') document.getElementById('hdrBadge').textContent='ADMIN';
  carregarTudo();
});

window.sair = async () => { await signOut(auth); window.location.href='index.html'; };

const $ = id => document.getElementById(id);
const fmt = v => v>=1000?'R$'+Math.round(v/1000)+'k':'R$'+Math.round(v);
const fmtPct = (v,t) => t>0?Math.round(v/t*100)+'%':'0%';
const setStatus = (txt,on=false) => { $('sTxt').textContent=txt; $('sDot').className='sdot'+(on?' on':''); };
const diasUteis = () => { const h=new Date(),f=new Date(h.getFullYear(),h.getMonth()+1,0);let c=0,d=new Date(h);d.setDate(d.getDate()+1);while(d<=f){if(d.getDay()!==0&&d.getDay()!==6)c++;d.setDate(d.getDate()+1);}return c; };
const tick = () => $('clock').textContent = new Date().toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).toUpperCase();
tick(); setInterval(tick,30000);

const md2html = t => t
  .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
  .replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
  .replace(/^##\s+(.+)$/gm,'<h3>$1</h3>')
  .replace(/^#\s+(.+)$/gm,'<h3>$1</h3>')
  .replace(/\n\n+/g,'</p><p>')
  .replace(/\n/g,'<br>');

async function claudeCall(prompt) {
  const r = await fetch('/api/claude', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-haiku-4-5-20251001',
      max_tokens:1500,
      mcp_servers:[
        {type:'url',url:API.salesforce,name:'salesforce'},
        {type:'url',url:API.nitzap,name:'nitzap'}
      ],
      system:`Você é um consultor de alta performance comercial analisando a equipe de vendas da Sabagram (granitos e mármores, ES).
Data: ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
Mês: junho/2026 | Dias úteis restantes: ${diasUteis()}
Responda em português. Seja direto, específico e acionável. Use dados reais.`,
      messages:[{role:'user',content:prompt}]
    })
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const data = await r.json();
  return data.content?.map(b=>b.text||'').join('')||'';
}

function getStatusTag(d) {
  const pct = d.meta>0?d.fat/d.meta*100:0;
  const ligPorDia = d.ligacoesHoje;
  if(pct<5 && ligPorDia<5) return {cls:'st-critico',txt:'🔴 CRÍTICO'};
  if(pct<20) return {cls:'st-alerta',txt:'🟡 ALERTA'};
  return {cls:'st-ok',txt:'✅ NO CAMINHO'};
}

function renderVendedorCard(v, d) {
  const pct = Math.min(100,Math.round(d.fat/d.meta*100));
  const falta = d.meta - d.fat;
  const dias = diasUteis();
  const porDia = Math.round(falta/Math.max(dias,1));
  const corProg = pct<10?'var(--red)':pct<40?'var(--amber)':'var(--green)';
  const st = getStatusTag(d);

  return `
    <div class="vcard">
      <div class="vcard-hdr">
        <div class="vcard-avatar" style="background:${v.cor||'var(--navy)'}">${v.avatar}</div>
        <div class="vcard-info">
          <div class="vcard-nome">${v.nome}</div>
          <div class="vcard-cargo">BU Mercado Interno · Meta ${fmt(d.meta)}</div>
        </div>
        <span class="status-tag ${st.cls}">${st.txt}</span>
      </div>
      <div class="vcard-body">
        <div class="vmetrics">
          <div class="vm"><div class="vm-v" style="color:var(--navy)">${fmt(d.fat)}</div><div class="vm-l">Faturado</div></div>
          <div class="vm"><div class="vm-v" style="color:var(--amber)">${pct}%</div><div class="vm-l">Atingido</div></div>
          <div class="vm"><div class="vm-v" style="color:var(--red)">${fmt(falta)}</div><div class="vm-l">Falta</div></div>
          <div class="vm"><div class="vm-v" style="color:${d.ligacoesHoje>=10?'var(--green)':d.ligacoesHoje>=5?'var(--amber)':'var(--red)'}">${d.ligacoesHoje}</div><div class="vm-l">Lig. hoje</div></div>
          <div class="vm"><div class="vm-v" style="color:var(--text2)">${d.clientes}</div><div class="vm-l">Clientes/mês</div></div>
          <div class="vm"><div class="vm-v" style="color:var(--text2)">${fmt(porDia)}</div><div class="vm-l">Falta/dia</div></div>
        </div>
        <div class="prog"><div class="prog-fill" style="width:${pct}%;background:${corProg}"></div></div>
        <div class="prog-label">${pct}% da meta · ${dias} dias úteis restantes</div>

        <div class="ia-section">
          <div class="ia-hdr">
            <div class="ia-badge"><div class="ia-pulse on" id="pulse-${v.avatar}"></div>IA</div>
            <div class="ia-title">Análise de performance + plano de ação do gerente</div>
          </div>
          <div class="ia-content" id="ia-${v.avatar}">
            <div class="spin-wrap"><div class="spinner"></div> Analisando dados do Salesforce...</div>
          </div>
        </div>
      </div>
    </div>`;
}

async function gerarAnalise(v, d) {
  const el = document.getElementById('ia-'+v.avatar);
  const pulse = document.getElementById('pulse-'+v.avatar);
  if(!el) return;

  const pct = d.meta>0?Math.round(d.fat/d.meta*100):0;
  const falta = d.meta - d.fat;
  const dias = diasUteis();

  const prompt = `Analise a performance de ${v.nome} na Sabagram e dê ao gerente Dhiego um plano completo de ação.

DADOS REAIS DE JUNHO/2026:
- Faturado: ${fmt(d.fat)} de ${fmt(d.meta)} (${pct}% da meta)
- Falta: ${fmt(falta)} em ${dias} dias úteis = ${fmt(Math.round(falta/Math.max(dias,1)))} por dia útil
- Ligações hoje: ${d.ligacoesHoje} (${d.ligacoesAtendidas} atendidas)
- Ligações no mês: ${d.ligacoesMes}
- Clientes únicos faturados no mês: ${d.clientes}
- Último pedido: ${d.ultimoPedido}

Busque no Salesforce as últimas 10 Tasks (ligações) deste vendedor (OwnerId: ${v.salesforce.userId}) para enriquecer a análise com dados reais de hoje.

Gere para o GERENTE DHIEGO:

### 🔍 Diagnóstico real
O que está acontecendo de fato com este vendedor — atividade, qualidade, padrão de comportamento. Baseado nos dados reais. 2-3 frases diretas.

### 🚨 Problemas identificados
Lista de 2-3 problemas específicos com evidência nos dados. Para cada um: o problema + o impacto direto no resultado.

### 🎯 O que um gerente de alta performance faz agora
3 ações concretas que Dhiego deve executar HOJE ou esta semana para reverter a situação. Não genéricas — específicas para este vendedor e este momento.

### 💬 Perguntas para a reunião 1:1
2 perguntas exatas que Dhiego deve fazer ao vendedor — perguntas que revelam a causa raiz do problema e forçam comprometimento.

### 📈 Métrica de acompanhamento semanal
Uma métrica específica com número atual e onde precisa chegar até sexta.

Seja direto. Sem rodeios. Tom de consultor de alta performance, não de RH.
Máximo 350 palavras.`;

  try {
    const txt = await claudeCall(prompt);
    el.innerHTML = `<p>${md2html(txt)}</p>`;
    if(pulse) pulse.classList.remove('on');
  } catch(e) {
    el.innerHTML = `<span style="color:var(--red);font-size:12px;font-family:'JetBrains Mono',monospace">Erro: ${e.message}</span>`;
  }
}

window.carregarTudo = async () => {
  const btn = $('btnRefresh');
  btn.disabled = true; $('btnIcon').textContent='↻';
  $('topbar').className='topbar on';
  setStatus('Buscando dados do time...', true);

  const dias = diasUteis();

  // Consolidado com dados reais
  let fatTotal=0, metaTotal=0;
  for(const v of VENDEDORES) {
    const d = DADOS_REAIS[v.email];
    if(d){ fatTotal+=d.fat; metaTotal+=d.meta; }
  }
  const pctTotal = metaTotal>0?Math.min(100,Math.round(fatTotal/metaTotal*100)):0;
  const faltaTotal = metaTotal - fatTotal;

  $('cFatTotal').textContent = fmt(fatTotal);
  $('cMetaTotal').textContent = fmt(metaTotal);
  $('cPct').textContent = pctTotal+'%';
  $('cPct').style.color = pctTotal<20?'#ff8a80':pctTotal<50?'var(--gold-l)':'#69f0ae';
  $('cDias').textContent = dias+' dias úteis restantes';
  $('cFalta').textContent = fmt(Math.max(0,faltaTotal));
  $('cPorDia').textContent = fmt(Math.round(faltaTotal/Math.max(dias,1)))+' por dia útil';

  // Renderizar cards
  $('vendedoresGrid').innerHTML = VENDEDORES
    .map(v => renderVendedorCard(v, DADOS_REAIS[v.email]||{fat:0,meta:300000,clientes:0,ligacoesHoje:0,ligacoesAtendidas:0,ligacoesMes:0,diasSemPedido:0,ultimoPedido:'—'}))
    .join('');

  setStatus('Gerando análise de performance com IA...', true);

  // Gerar análise para cada vendedor (paralelo)
  await Promise.all(VENDEDORES.map(v => gerarAnalise(v, DADOS_REAIS[v.email]||{})));

  const ts = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  setStatus(`Atualizado às ${ts}`, false);
  $('topbar').className='topbar done';
  setTimeout(()=>$('topbar').className='topbar',600);
  btn.disabled=false; $('btnIcon').textContent='↻';
};

// Auto-refresh 06h e 12h
setInterval(()=>{
  const h=new Date().getHours(),m=new Date().getMinutes();
  if((h===6||h===12)&&m<5) window.carregarTudo();
},60000);
</script>
