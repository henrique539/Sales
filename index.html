<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabagram · Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#f4f6f9;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:16px;
  box-shadow:0 4px 24px rgba(26,50,84,.12);
  width:100%;
  max-width:400px;
  overflow:hidden;
}
.card-header{
  background:#1a3254;
  padding:32px 36px 28px;
  text-align:center;
}
.logo{
  font-size:22px;
  font-weight:800;
  color:white;
  letter-spacing:.05em;
  margin-bottom:4px;
}
.logo span{color:#e0aa18}
.logo-sub{
  font-size:12px;
  color:rgba(255,255,255,.45);
  letter-spacing:.05em;
  font-weight:500;
}
.card-body{padding:32px 36px}

/* FORM */
.field{margin-bottom:18px}
.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#7589a8;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.field input{
  width:100%;
  padding:11px 14px;
  border:1.5px solid #e2e7ef;
  border-radius:9px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;
  color:#1a2540;
  background:#f8f9fc;
  transition:border-color .15s,box-shadow .15s;
  outline:none;
}
.field input:focus{
  border-color:#1a3254;
  background:white;
  box-shadow:0 0 0 3px rgba(26,50,84,.08);
}

/* BOTÕES */
.btn-google{
  width:100%;
  padding:12px;
  border:1.5px solid #e2e7ef;
  border-radius:9px;
  background:white;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;
  font-weight:600;
  color:#1a2540;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:all .15s;
  margin-bottom:20px;
}
.btn-google:hover{border-color:#1a3254;background:#f8f9fc}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}
.divider-line{flex:1;height:1px;background:#e2e7ef}
.divider-txt{font-size:11px;color:#a8b8cf;font-weight:600}

.btn-login{
  width:100%;
  padding:12px;
  background:#1a3254;
  border:none;
  border-radius:9px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;
  font-weight:700;
  color:white;
  cursor:pointer;
  transition:opacity .15s;
  margin-top:6px;
}
.btn-login:hover{opacity:.88}
.btn-login:disabled{opacity:.4;cursor:not-allowed}

/* ERRO */
.error{
  background:#fdf3f2;
  border:1px solid rgba(192,57,43,.2);
  border-radius:8px;
  padding:10px 13px;
  font-size:13px;
  color:#c0392b;
  margin-bottom:16px;
  display:none;
}
.error.show{display:block}

/* LOADING */
.loading{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:20px 0 4px;
  text-align:center;
}
.loading.show{display:flex}
.spinner{
  width:32px;height:32px;
  border:3px solid #e2e7ef;
  border-top-color:#1a3254;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:#7589a8;font-weight:500}

.card-footer{
  padding:16px 36px;
  border-top:1px solid #f0f3f7;
  text-align:center;
  font-size:11px;
  color:#a8b8cf;
}

/* GOOGLE ICON */
.google-icon{width:18px;height:18px;flex-shrink:0}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo">SABA<span>GRAM</span></div>
    <div class="logo-sub">PORTAL COMERCIAL</div>
  </div>

  <div class="card-body">

    <!-- Erro -->
    <div class="error" id="errMsg"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-txt">Entrando...</div>
    </div>

    <!-- Form -->
    <div id="formArea">
      <!-- Login com Google -->
      <button class="btn-google" onclick="loginGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Entrar com Google
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-txt">ou</div>
        <div class="divider-line"></div>
      </div>

      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu@sabagram.com.br" autocomplete="email">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')loginEmail()">
      </div>
      <button class="btn-login" id="btnLogin" onclick="loginEmail()">Entrar</button>
    </div>

  </div>
  <div class="card-footer">Acesso restrito · Sabagram Granitos e Mármores</div>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp }                        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword,
         GoogleAuthProvider, signInWithPopup,
         onAuthStateChanged }                   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { FIREBASE_CONFIG, USUARIOS }            from "./config.js";

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);

// Se já está logado, redireciona direto
onAuthStateChanged(auth, user => {
  if (user) rotear(user.email);
});

function mostrarErro(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.classList.add('show');
}
function ocultarErro() {
  document.getElementById('errMsg').classList.remove('show');
}
function setLoading(on) {
  document.getElementById('loading').classList.toggle('show', on);
  document.getElementById('formArea').style.display = on ? 'none' : 'block';
  document.getElementById('btnLogin').disabled = on;
}
function rotear(email) {
  const u = USUARIOS[email.toLowerCase()];
  if (!u) { mostrarErro('Acesso não autorizado para este e-mail.'); return; }
  sessionStorage.setItem('sb_user', JSON.stringify({ email, ...u }));
  const perfil = u.perfil;
  if (perfil === 'admin' || perfil === 'gerente') {
    window.location.href = 'gerente.html';
  } else {
    window.location.href = 'vendedor.html';
  }
}

// Login Email
window.loginEmail = async () => {
  ocultarErro();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  if (!email || !senha) { mostrarErro('Preencha e-mail e senha.'); return; }
  setLoading(true);
  try {
    const cred = await signInWithEmailAndPassword(auth, email, senha);
    rotear(cred.user.email);
  } catch (e) {
    setLoading(false);
    const msgs = {
      'auth/user-not-found':  'E-mail não encontrado.',
      'auth/wrong-password':  'Senha incorreta.',
      'auth/invalid-email':   'E-mail inválido.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.'
    };
    mostrarErro(msgs[e.code] || 'Erro ao entrar. Tente novamente.');
  }
};

// Login Google
window.loginGoogle = async () => {
  ocultarErro();
  setLoading(true);
  try {
    const provider = new GoogleAuthProvider();
    const cred = await signInWithPopup(auth, provider);
    rotear(cred.user.email);
  } catch (e) {
    setLoading(false);
    if (e.code !== 'auth/popup-closed-by-user') {
      mostrarErro('Erro ao entrar com Google. Tente novamente.');
    }
  }
};
</script>
</body>
</html>
