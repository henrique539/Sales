<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabagram · Vendedor</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3254;--navy2:#0f1f35;--gold:#c8960a;--gold-l:#e0aa18;
  --bg:#f4f6f9;--white:#fff;--s2:#f8f9fc;
  --border:#e2e7ef;--text:#1a2540;--text2:#3d5073;--muted:#7589a8;--dim:#a8b8cf;
  --red:#c0392b;--rbg:rgba(192,57,43,.08);--rbd:rgba(192,57,43,.25);
  --amber:#d97706;--abg:rgba(217,119,6,.08);--abd:rgba(217,119,6,.25);
  --green:#1a7a4a;--gbg:rgba(26,122,74,.08);--gbd:rgba(26,122,74,.25);
  --blue:#1e5fa0;--bbg:rgba(30,95,160,.08);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden;display:flex;flex-direction:column}

.hdr{background:var(--navy);height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:200}
.logo{font-weight:800;font-size:15px;color:white;letter-spacing:.04em}.logo span{color:var(--gold-l)}
#clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.35)}
.hbtn{background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}

.content{overflow-y:auto;flex:1;padding:14px 20px 40px}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid var(--border);background:var(--s2);color:var(--muted);transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif}
.tab.on{background:var(--navy);color:white;border-color:var(--navy)}

/* VENDOR HEADER */
.vhdr{background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:white;flex-shrink:0}
.vhdr-nome{font-size:15px;font-weight:700;color:var(--text)}
.vhdr-sub{font-size:11px;color:var(--muted);margin-top:2px}
.vhdr-right{display:flex;align-items:center;gap:8px}
.vhdr-stat{background:var(--s2);border-radius:8px;padding:6px 12px;text-align:center}
.vhdr-val{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace}
.vhdr-lbl{font-size:9px;color:var(--muted);margin-top:1px}

/* TARJA */
.tarja{border-radius:12px;padding:14px 18px;margin-bottom:10px}
.t-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.t-icon{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex-shrink:0;margin-top:2px}
.t-main{font-size:15px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:3px}
.t-sub{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5}
.t-pills{display:flex;gap:7px;flex-wrap:wrap}
.t-pill{background:rgba(255,255,255,.13);border-radius:7px;padding:5px 12px;text-align:center}
.t-pv{font-size:14px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace}
.t-pl{font-size:9px;color:rgba(255,255,255,.55);margin-top:1px}

/* ANEL + STATS */
.hero-inner{display:flex;align-items:center;gap:20px;padding:4px 0}
.ring-side{flex-shrink:0}
.stats-side{flex:1}
.s3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sc{background:var(--s2);border-radius:9px;padding:9px 10px;text-align:center}
.sv{font-size:17px;font-weight:700;font-family:'JetBrains Mono',monospace}
.sl{font-size:10px;color:var(--muted);margin-top:2px}

/* FREQ CONTATOS */
.card{background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.freq-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.fl{font-size:12px;color:var(--text2);width:120px;flex-shrink:0}
.fb{flex:1;height:7px;background:var(--s2);border-radius:3px;overflow:hidden}
.ff{height:7px;border-radius:3px}
.fn{font-size:12px;font-weight:600;width:24px;text-align:right;flex-shrink:0}
.fp{font-size:11px;color:var(--dim);width:28px;text-align:right;flex-shrink:0}

/* ACOES */
.acao{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;margin-bottom:7px}
.acao:last-child{margin-bottom:0}
.an{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.ah{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.ap{font-size:12px;color:var(--text2);line-height:1.45}
.aimp{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}

/* HIST */
.mr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ml{font-size:11px;color:var(--muted);width:26px}
.mb{flex:1;height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.mf{height:5px;border-radius:3px}
.mv{font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;width:42px;text-align:right}
.mp2{font-size:10px;color:var(--dim);width:20px;text-align:right}

/* FILA */
.fila-hdr{background:var(--navy);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.fi{border:0.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:7px}
.fi-grid{display:grid;grid-template-columns:1.6fr 1.8fr 2.2fr 0.8fr}
.fi-col{padding:10px 12px}
.fi-col-c{background:var(--navy);border-right:0.5px solid rgba(255,255,255,.1)}
.fi-col-s{background:var(--white);border-right:0.5px solid var(--border)}
.fi-col-sc{background:var(--s2);border-right:0.5px solid var(--border)}
.fi-col-a{background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.ftag{display:inline-flex;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700}
.fi-nome{font-size:12px;font-weight:700;color:white;margin:4px 0 2px}
.fi-sub2{font-size:10px;color:rgba(255,255,255,.45)}
.fi-lbl{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.fi-txt{font-size:11px;color:var(--text2);line-height:1.5}
.fi-script{font-size:11px;color:var(--text2);line-height:1.55;font-style:italic}
.btn-wa{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;border:0.5px solid #c0dd97;cursor:pointer;background:#eaf3de;color:#1a5f3a;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
.btn-lig{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;border:0.5px solid #b5d4f4;cursor:pointer;background:#e6f1fb;color:#0c447c;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
.col-hdr{display:grid;grid-template-columns:1.6fr 1.8fr 2.2fr 0.8fr;margin-bottom:4px;padding:0 2px}
.ch{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:0 10px}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite}
</style>
</head>
<body>

<header class="hdr">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="logo">SABA<span>GRAM</span></div>
    <div style="width:1px;height:16px;background:rgba(255,255,255,.15)"></div>

<div class="content">

    <div id="fila-container">

        <div style="font-size:24px;margin-bottom:8px">⏳</div>
        Carregando sua fila de hoje...
      </div>

</div>

<script type="module">

};

const app=initializeApp(FB);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

const tick=()=>{$('clock').textContent=new Date().toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).toUpperCase();};
tick();setInterval(tick,30000);

const previewEmail=new URLSearchParams(window.location.search).get('preview');
const fmt=(v,m)=>m==='USD'?`US$${Math.round(v/1000)}k`:`R$${Math.round(v/1000)}k`;

// ─── DESEMPENHO ─────────────────────────────────────────────────────────────

function renderDesempenho(vd, vInfo, ligacoes, email){
  const meses_pt=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const moeda = vInfo.moeda||'BRL';
  const metaVal = vInfo.metaVal||0;
  const fat = vd.mesAtual?.faturamento||0;
  const fatAnt = vd.meses?.slice(-2,-1)[0]?.faturamento||0;
  const pct = vd.mesAtual?.pctMeta||0;
  const proj = vd.mesAtual?.projecao||0;
  const ticket = vd.ticket3m||0;
  const pedidos = vd.mesAtual?.pedidos||0;
  const porMes = (vd.meses||[]).slice(-6);
  const maxFat = Math.max(...porMes.map(m=>m.faturamento),1);
  const diasUteis = 22;
  const diaAtual = new Date().getDate();
  const diasRestantes = Math.max(diasUteis - Math.round(diaAtual * diasUteis/30), 1);
  const faltam = Math.max(metaVal - fat, 0);
  const pctAnl = Math.min(pct, 100);
  const projCor = proj >= metaVal ? '#4ade80' : '#E24B4A';

  // Conversão: clientes contatados este mês × pedidos fechados
  const _mesN = new Date().getMonth()+1;
  const _anoN = new Date().getFullYear();
  const ligMes = ligacoes.filter(l=>{const d=new Date(l.ActivityDate||l.CreatedDate||'');return d.getFullYear()===_anoN&&d.getMonth()+1===_mesN;});
  const clientesMes = new Set(ligMes.map(l=>l.WhatId).filter(Boolean)).size;
  const taxaConv = clientesMes>0?Math.round(pedidos/clientesMes*100):0;

  // Ligações
  const totalLig = ligacoes.length;
  const ligAtend = ligacoes.filter(l=>(l.Subject||'').includes('Atendida')&&!(l.Subject||'').includes('Não Atendida')).length;
  const taxaAtend = totalLig>0?Math.round(ligAtend/totalLig*100):0;
  const clientesLig = new Set(ligacoes.map(l=>l.WhatId).filter(Boolean));

  // Cobertura da carteira — dados reais do Salesforce
  const total = clientesLig.size;
  const carteiraClientes = vInfo?.carteiraClientes || 0;
  const carteiraProspects = vInfo?.carteiraProspects || 0;
  const carteira = carteiraClientes + carteiraProspects || Math.max(total, Math.round(metaVal / (ticket||1) * 2));
  const freq0 = Math.max(0, carteira - total);

  // Tarja
  const riscoNivel = pct < 30 ? 'danger' : pct < 70 ? 'warn' : 'ok';
  const tarjaBg = riscoNivel==='danger'?'#A32D2D':riscoNivel==='warn'?'#854F0B':'#27500A';
  const tarjaIcon = riscoNivel==='danger'?'📉':riscoNivel==='warn'?'⚡':'🎯';
  let tarjaMain, tanjaSub;
  if(riscoNivel==='danger'){
    tarjaMain=`No ritmo atual você vai fechar o mês com ${fmt(proj,moeda)} — ${Math.round(proj/metaVal*100)}% da meta.`;
    tanjaSub=`Faltam ${fmt(faltam,moeda)} em ${diasRestantes} dias úteis. ${fatAnt>fat?`Em ${porMes.slice(-2,-1)[0]?.mes ? meses_pt[porMes.slice(-2,-1)[0].mes-1] : 'mês anterior'} você fez ${fmt(fatAnt,moeda)}. A capacidade está aqui.`:''}`;
  } else if(riscoNivel==='warn'){
    tarjaMain=`Está no caminho certo, mas precisa acelerar para garantir a meta.`;
    tanjaSub=`${pct}% da meta atingida. Faltam ${fmt(faltam,moeda)} em ${diasRestantes} dias úteis.`;
  } else {
    tarjaMain=`Excelente! Você está no ritmo certo para bater a meta.`;
    tanjaSub=`${pct}% da meta atingida. Mantenha o ritmo e feche mais ${fmt(faltam,moeda)}.`;
  }

  const histBars = porMes.map(m=>{
    const w=Math.round(m.faturamento/maxFat*100);
    const isCurrent = m.mes===new Date().getMonth()+1;
    const cor = isCurrent ? '#BA7517' : '#B5D4F4';
    const textCor = isCurrent ? '#BA7517' : 'var(--muted)';
    return `<div class="mr"><span class="ml">${meses_pt[(m.mes||1)-1]}</span><div class="mb"><div class="mf" style="width:${w}%;background:${cor}"></div></div><span class="mv" style="color:${textCor}">${fmt(m.faturamento,moeda)}</span><span class="mp2">${m.pedidos}p</span></div>`;
  }).join('');

  // Ações baseadas em dados reais
  const acoes = [];
  if(totalLig===0){
    acoes.push({bg:'#FCEBEB',nbg:'#E24B4A',txt:'Comece a ligar hoje — zero ligações em 90 dias é crítico',desc:`Com ${pedidos>0?Math.round(fat/pedidos/1000)+'k de ticket':'seu ticket médio'}, cada ligação atendida vale oportunidade real.`,imp:'urgente: comece agora',impbg:'#F7C1C1',impcor:'#791F1F'});
  } else if(taxaAtend<30){
    acoes.push({bg:'#FCEBEB',nbg:'#E24B4A',txt:`Melhore o horário das ligações — só ${taxaAtend}% atendendo`,desc:'Tente ligar entre 10h-12h e 14h-17h. Avise por WA antes de ligar.',imp:`+${Math.round((50-taxaAtend)/100*totalLig)} atendimentos/mês`,impbg:'#F7C1C1',impcor:'#791F1F'});
  }
  if(faltam>0&&diasRestantes>0){
    const porDia = Math.ceil(faltam/diasRestantes/ticket);
    acoes.push({bg:'#FAEEDA',nbg:'#BA7517',txt:`${porDia} pedidos por dia para fechar a meta`,desc:`Faltam ${fmt(faltam,moeda)} em ${diasRestantes} dias úteis. Com ticket de ${fmt(ticket,moeda)}, são ${porDia} pedido(s)/dia. Priorize os clientes da sua fila.`,imp:`${fmt(faltam,moeda)} para fechar`,impbg:'#FAC775',impcor:'#633806'});
  }
  if(freq0>0){
    acoes.push({bg:'#EAF3DE',nbg:'#639922',txt:`${freq0} clientes sem contato este mês`,desc:`Com ${Math.round(pedidos/(total||1)*100)}% de conversão, contatar ${Math.min(freq0,10)} clientes novos esta semana pode gerar ${Math.round(Math.min(freq0,10)*pedidos/(total||1))} pedidos extras.`,imp:`+${fmt(Math.round(Math.min(freq0,10)*pedidos/(total||1))*ticket,moeda)} potencial`,impbg:'#C0DD97',impcor:'#173404'});
  }
  if(!acoes.length){
    acoes.push({bg:'#EAF3DE',nbg:'#639922',txt:'Continue o bom trabalho e reative inativos',desc:'Clientes com 90+ dias sem comprar têm alto potencial. 1 reativação já ajuda a meta.',imp:'impacto imediato',impbg:'#C0DD97',impcor:'#173404'});
  }

  const acoesHTML = acoes.slice(0,3).map((a,i)=>`
    <div class="acao" style="background:${a.bg}">
      <div class="an" style="background:${a.nbg};color:#fff">${i+1}</div>
      <div>
        <div class="ah">${a.txt}</div>
        <div class="ap">${a.desc}</div>
        <div class="aimp" style="background:${a.impbg};color:${a.impcor}">${a.imp}</div>
      </div>
    </div>`).join('');

  return `
  <!-- TARJA -->
  <div class="tarja" style="background:${tarjaBg}">
    <div class="t-top">
      <div class="t-icon">${tarjaIcon}</div>

function urgencia(c){
  const dias=parseFloat(c.QtdDip__c)||0;
  const score=parseInt(c.ScoAco__c)||0;
  if(score>=4&&dias>180) return 'CRÍTICO';
  if(score>=3&&dias>120) return 'URGENTE';
  if(dias>90)            return 'ALTA';
  if(dias>60)            return 'ATENÇÃO';
  return 'MANUTENÇÃO';
}

function statusTag(c){
  if(c.contatado&&c.respondeu) return {txt:'✓ Respondeu',bg:'#dcfce7',cor:'#166534'};
  if(c.contatado)               return {txt:'✓ Contatado',bg:'#d1fae5',cor:'#065f46'};
  return                               {txt:'⏳ Pendente', bg:'#fee2e2',cor:'#991b1b'};
}

function urg_cor(u){
  if(u==='CRÍTICO') return {bg:'rgba(248,113,113,.2)',cor:'#f87171'};
  if(u==='URGENTE') return {bg:'rgba(251,191,36,.2)',cor:'#fbbf24'};
  if(u==='ALTA')    return {bg:'rgba(96,165,250,.2)',cor:'#60a5fa'};
  if(u==='ATENÇÃO') return {bg:'rgba(167,139,250,.2)',cor:'#a78bfa'};
  return {bg:'rgba(255,255,255,.1)',cor:'rgba(255,255,255,.5)'};
}

function renderFila(fila,vInfo,scripts){
  const contatados=fila.filter(c=>c.contatado).length;
  const meta=vInfo?.contatos_dia||fila.length;
  const pct=meta>0?Math.round(contatados/meta*100):0;
  const stars=s=>s?'⭐'.repeat(Math.min(parseInt(s)||1,5)):' ';

  const rows=fila.map((c,i)=>{
    const u=urgencia(c);
    const uc=urg_cor(u);
    const st=statusTag(c);
    const sc=scripts[c.Id]||c;
    const dias=parseFloat(c.QtdDip__c)||0;
    const temWA=!!(c.nitzap20__DateTime_Last_Sent_Whatsapp__c);

          <div class="fi-sub2">${dias>0?dias+' dias s/ comprar':'prospect'} · ${c.StsCli__c||'—'}</div>

            ${c.resumoLig?`<div style="font-size:10px;color:var(--text2);font-style:italic;margin-bottom:6px;line-height:1.4">"${c.resumoLig}"</div>`:'<div style="margin-bottom:6px"></div>'}

          ${c.waDtUltima||c.nitzap20__DateTime_Last_Sent_Whatsapp__c?`
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
              <span style="font-size:10px;font-weight:600;background:#dcfce7;color:#166534;padding:1px 6px;border-radius:4px">💬 ${new Date(c.waDtUltima||c.nitzap20__DateTime_Last_Sent_Whatsapp__c).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</span>

            ${sc.historico?`
              <div class="fi-lbl" style="color:#185FA5;margin-bottom:4px">Histórico</div>
              <div style="margin-bottom:8px">${sc.historico.split('|').map(b=>b.trim()).filter(Boolean).map(b=>`<div style="display:flex;gap:5px;align-items:baseline;margin-bottom:3px"><div style="width:5px;height:5px;border-radius:50%;background:#639922;flex-shrink:0;margin-top:4px"></div><div style="font-size:11px;color:var(--text2);line-height:1.4">${b}</div></div>`).join('')}</div>

  <div class="col-hdr">
    <div class="ch" style="padding:0 10px">Cliente</div>

}

function carregarVendedor(email,isPreview){
  const v=VENDEDORES[email];
  if(!v)return false;
  $('vAv').textContent=v.avatar;
  $('vAv').style.background=v.cor;
  $('vNome').textContent=(isPreview?'[Preview] ':'')+v.nome;
  $('vSub').textContent=v.bu+' · Meta '+v.meta+' · '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  $('vhdr').style.display='flex';

    bar.style.cssText='background:#d97706;color:white;text-align:center;font-size:11px;font-weight:700;padding:5px;letter-spacing:.05em;flex-shrink:0';

async function resolverVendedor(email){
  const base=VENDEDORES[email]||{};
  try{
    const snap=await getDoc(doc(db,'usuarios',email));
    if(snap.exists()){const d=snap.data();return{...base,nome:d.nome||base.nome,bu:d.bu||base.bu,email};}
  }catch(e){}
  return Object.keys(base).length?base:null;
}

async function carregarDesempenho(email){
  const container=$('desemp-container');
  const vInfo=VENDEDORES[email];
  const hoje=new Date().toISOString().slice(0,10);

  try{
    // Tenta hoje, fallback ontem
    let snapDesemp=await getDoc(doc(db,'contexto',`desempenho_${hoje}`));
    if(!snapDesemp.exists()){
      const ontem=new Date();ontem.setDate(ontem.getDate()-1);
      snapDesemp=await getDoc(doc(db,'contexto',`desempenho_${ontem.toISOString().slice(0,10)}`));
    }

    const vd=snapDesemp.exists()?(snapDesemp.data()?.vendedores?.[email]||null):null;

    if(!vd){
      container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">
        <div style="font-size:24px;margin-bottom:8px">📊</div>
        Dados de desempenho não disponíveis ainda.<br>
        <span style="font-size:11px">Disponível após o Make rodar às 06h25.</span>
      </div>`;
      return;
    }

    // Atualiza header
    const fat = vd.mesAtual?.faturamento||0;
    const fatAnt = vd.meses?.slice(-2,-1)[0]?.faturamento||0;
    const moeda = vd.moeda||vInfo?.moeda||'BRL';
    $('vFatJun').textContent=fmt(fat,moeda);
    $('vFatMai').textContent=fmt(fatAnt,moeda);
    const _mNomes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    $('vMesAtual').textContent=_mNomes[new Date().getMonth()]+' até agora';

    // Badge de risco no header
    const pct = vd.mesAtual?.pctMeta||0;
    if(pct<30){
      $('vRiscoTag').innerHTML=`<div style="background:#FCEBEB;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#A32D2D;display:flex;align-items:center;gap:5px">⚠️ risco de meta</div>`;
    } else if(pct<70){
      $('vRiscoTag').innerHTML=`<div style="background:#FAEEDA;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#854F0B;display:flex;align-items:center;gap:5px">⚡ acelerar</div>`;
    } else {
      $('vRiscoTag').innerHTML=`<div style="background:#EAF3DE;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#27500A;display:flex;align-items:center;gap:5px">✓ no ritmo</div>`;
    }

    // Ligações
    const token=await auth.currentUser.getIdToken();
    const respLig=await fetch(`/api/contexto?tipo=ligacoes&data=${hoje}`,{headers:{Authorization:`Bearer ${token}`}});
    const dataLig=await respLig.json();
    const sfUserId=vInfo?.sfUserId;
    const ligacoes=(dataLig.registros||[]).filter(l=>!sfUserId||l.OwnerId===sfUserId);

    container.innerHTML=renderDesempenho(vd, vInfo||{}, ligacoes, email);

  }catch(e){
    console.error('desempenho:',e);
    container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--red);font-size:13px">Erro ao carregar dados.</div>`;
  }
}

let _filaEmail='';
let _filaData='';
let _filaEmailKey='';

async function carregarFila(email){
  const container=$('fila-container');
  const hoje=new Date().toISOString().slice(0,10);
  const ontem=new Date();ontem.setDate(ontem.getDate()-1);
  const ontemStr=ontem.toISOString().slice(0,10);
  const vInfo=VENDEDORES[email];
  const emailKey=email.replace(/[@.]/g,m=>m==='@'?'_':m==='.'?'_':'_');

  try{
    const user=auth.currentUser;
    if(!user)return;
    const token=await user.getIdToken();

    let minha=[];
    let dataUsada=hoje;

    const resp=await fetch(`/api/fila?email=${emailKey}&data=${hoje}`,{headers:{Authorization:`Bearer ${token}`}});
    const data=await resp.json();
    minha=data.fila||[];

    if(!minha.length){
      const respOntem=await fetch(`/api/fila?email=${emailKey}&data=${ontemStr}`,{headers:{Authorization:`Bearer ${token}`}});
      const dataOntem=await respOntem.json();
      minha=dataOntem.fila||[];
      if(minha.length) dataUsada=ontemStr;
    }

    minha=minha.filter(c=>c.ScoAco__c!=='6');

    if(!minha.length){
      container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">
        <div style="font-size:24px;margin-bottom:8px">📭</div>
        Nenhum cliente na sua fila hoje.<br>
        <span style="font-size:11px">A fila é montada às 06h com dados do Salesforce.</span>
      </div>`;
      return;
    }

    _filaEmail=email;
    _filaData=dataUsada;
    _filaEmailKey=emailKey;

    const aviso=dataUsada!==hoje
      ?`<div style="background:#FAEEDA;border:0.5px solid #F5D08A;border-radius:9px;padding:9px 14px;margin-bottom:10px;font-size:12px;color:#854F0B">
          ⚠️ Mostrando fila de ontem (${new Date(ontemStr+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}) — a de hoje ainda não foi gerada.
        </div>`
      :'';

    container.innerHTML=aviso+renderFila(minha,vInfo,{});

  }catch(e){
    console.error('Erro fila:',e);
    container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--red);font-size:13px">Erro ao carregar a fila. Tente novamente.</div>`;
  }
}

  if(!cont)return;
  const total=fila.length;
  const feitos=fila.filter(c=>c.contatado).length;
  cont.textContent=`✓ ${feitos} contatados`;
  pend.textContent=`⏳ ${total-feitos} pendentes`;
  pct.textContent=`${total>0?Math.round(feitos/total*100):0}% cumprido`;
}

// ── Marcar feito manualmente ──────────────────────────────────────────────────
window.marcarFeito=async(btn,id)=>{
  if(btn.disabled)return;
  btn.disabled=true;btn.style.opacity='.5';
  try{
    const user=auth.currentUser;
    if(!user||!_filaEmail)return;
    const token=await user.getIdToken();
    await fetch('/api/fila',{
      method:'PATCH',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
      body:JSON.stringify({email:_filaEmail,data:_filaData,clienteId:id,contatado:true})
    });
    aplicarContatado(id);
    // Atualiza contador via re-fetch leve
    sincronizarContatados();
  }catch(e){
    console.error('marcarFeito:',e);
    btn.disabled=false;btn.style.opacity='1';
  }
};

// ── Sincronização automática a cada 5 minutos ────────────────────────────────
async function sincronizarContatados(){
  if(!_filaEmail||!_filaData||!_filaEmailKey)return;
  try{
    const user=auth.currentUser;
    if(!user)return;
    const token=await user.getIdToken();
    const resp=await fetch(`/api/fila?email=${_filaEmailKey}&data=${_filaData}`,{headers:{Authorization:`Bearer ${token}`}});
    const data=await resp.json();
    const fila=data.fila||[];
    fila.forEach(c=>{if(c.contatado)aplicarContatado(c.Id);});
    atualizarContador(fila);
  }catch(e){}
}

setInterval(sincronizarContatados,5*60*1000);

window.sair=async()=>{await signOut(auth);window.location.href='index.html';};

let _emailAtual='';
let _filaCarregada=false;


window.showTab=(id,btn)=>{
  ['desempenho','fila'].forEach(t=>{const el=$('tab-'+t);if(el)el.style.display='none';});
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  const sec=$('tab-'+id);if(sec)sec.style.display='block';
  btn.classList.add('on');
  if(id==='fila'&&!_filaCarregada&&_emailAtual){
    _filaCarregada=true;
    carregarFila(_emailAtual);
  }
};

if(previewEmail){
  onAuthStateChanged(auth,async user=>{
    if(!user){window.location.href='index.html';return;}
    const v=await resolverVendedor(previewEmail);
    if(v){carregarVendedor(previewEmail,true);_emailAtual=previewEmail;carregarDesempenho(previewEmail);}
    else{window.location.href='gerente.html';}
  });
}else{
  onAuthStateChanged(auth,async user=>{
    if(!user){window.location.href='index.html';return;}
    const email=user.email.toLowerCase();
    const v=await resolverVendedor(email);
    if(v&&VENDEDORES[email]){
      carregarVendedor(email,false);
      _emailAtual=email;
      carregarDesempenho(email);
    }else{
      window.location.href='gerente.html';
    }
  });
}
</script>
