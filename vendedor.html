function fsToVal(v){
  if(!v)return null;
  if(v.stringValue!==undefined)return v.stringValue;
  if(v.integerValue!==undefined)return parseInt(v.integerValue);
  if(v.doubleValue!==undefined)return v.doubleValue;
  if(v.booleanValue!==undefined)return v.booleanValue;
  if(v.nullValue!==undefined)return null;
  if(v.arrayValue)return(v.arrayValue.values||[]).map(fsToVal);
  if(v.mapValue){const o={};for(const[k,val]of Object.entries(v.mapValue.fields||{}))o[k]=fsToVal(val);return o;}
  return null;
}

// ─── CARREGAR DESEMPENHO DO FIRESTORE ────────────────────────────────────────
async function carregarDesempenho(email, vInfo) {
  const container = $('desemp-container');
  const hoje = new Date().toISOString().slice(0,10);
  const mesAtual = new Date().getMonth() + 1;
  const moeda = vInfo.moeda || 'BRL';

  try {
    // 1. Ler desempenho direto do Firestore SDK
    const snapDesemp = await getDoc(doc(db, 'contexto', `desempenho_${hoje}`));
    const vd = snapDesemp.exists() ? (snapDesemp.data()?.vendedores?.[email] || null) : null;

    // 2. Ler ligações direto do Firestore SDK
    const snapLig = await getDoc(doc(db, 'contexto', `ligacoes_${hoje}`));
    const todasLigs = snapLig.exists() ? (snapLig.data()?.registros || []) : [];
    const ligacoes = todasLigs.filter(l => l.OwnerId === vInfo.userId);

    if (!vd) {
      container.innerHTML = renderDesempenhoVazio(vInfo);
      return;
    }

    // 3. Extrair dados do objeto vendedor
    const mesesArr = vd.meses || [];
    const porMes = {};
    mesesArr.forEach(m => {
      porMes[m.mes] = { pedidos: m.pedidos || 0, faturamento: m.faturamento || 0 };
    });

    const dadosMesAtual = porMes[mesAtual] || { pedidos: 0, faturamento: 0 };
    const dadosMesAnt   = porMes[mesAtual - 1] || { pedidos: 0, faturamento: 0 };

    // 4. Ticket médio do desempenho
    const ticketMedio = vd.ticket3m || vd.ticketMedio || 0;

    // 5. Métricas de ligações
    const totalLig     = ligacoes.length;
    const ligAtendidas = ligacoes.filter(l => (l.Subject||'').includes('Atendida') && !(l.Subject||'').includes('Não Atendida')).length;
    const taxaAtend    = totalLig > 0 ? Math.round(ligAtendidas / totalLig * 100) : 0;

    // 6. Conversão
    const taxaConv = ligAtendidas > 0 ? Math.min(99, Math.round(dadosMesAtual.pedidos / ligAtendidas * 100)) : 0;

    // 7. Meta e projeção
    const metaVal      = vInfo.metaVal;
    const fatAtual     = vd.mesAtual?.faturamento || Math.round(dadosMesAtual.faturamento);
    const metaRestante = Math.max(0, metaVal - fatAtual);
    const diaHoje      = new Date().getDate();
    const diasMes      = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const projecao     = diaHoje > 0 ? Math.round(fatAtual / diaHoje * diasMes) : 0;
    const pctMeta      = metaVal > 0 ? Math.round(fatAtual / metaVal * 100) : 0;
    const pctProjecao  = metaVal > 0 ? Math.round(projecao / metaVal * 100) : 0;
    const fatAnt       = Math.round(dadosMesAnt.faturamento);
    const deltaFat     = fatAnt > 0 ? Math.round((fatAtual - fatAnt) / fatAnt * 100) : 0;
    const clientesMes  = vd.mesAtual?.pedidos || dadosMesAtual.pedidos;

    // 8. Insights via IA
    const insights = await gerarInsightsIA({
      nome: vInfo.nome, bu: vInfo.bu, moeda,
      fatAtual, fatAnt, metaVal, metaRestante, pctMeta,
      ticketMedio, taxaAtend, taxaConv,
      totalLig, ligAtendidas, pedidosMes: dadosMesAtual.pedidos,
      clientesMes, projecao, diasMes, diaHoje,
      porMes: mesesArr.map(m => ({mes: NOMES_MESES[m.mes], pedidos: m.pedidos, faturamento: m.faturamento})),
    });

    container.innerHTML = renderDesempenho({
      fatAtual, fatAnt, metaVal, metaRestante, pctMeta, projecao, pctProjecao,
      ticketMedio, taxaAtend, taxaConv,
      totalLig, ligAtendidas, pedidosMes: dadosMesAtual.pedidos,
      clientesMes, deltaFat, porMes, mesAtual, moeda, insights,
    });

    // Atualizar header
    $('vFatJun').textContent = fmt(fatAtual, moeda);
    $('vFatMai').textContent = fmt(fatAnt, moeda);
    $('vFatJunLbl').textContent = NOMES_MESES[mesAtual] + ' até agora';
    $('vFatMaiLbl').textContent = NOMES_MESES[mesAtual-1] + ' completo';

  } catch(e) {
    console.error('Desempenho erro:', e);
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--red);font-size:13px">Erro ao carregar desempenho: ${e.message}</div>`;
  }
}

// ─── INSIGHTS VIA IA ─────────────────────────────────────────────────────────
async function gerarInsightsIA(ctx) {
  try {
    const prompt = `Você é coach de vendas da Sabagram Granitos e Mármores. Analise o desempenho de ${ctx.nome} (${ctx.bu}).

DADOS DO MÊS ATUAL:
- Faturamento: ${ctx.moeda==='USD'?'US$':'R$'}${Math.round(ctx.fatAtual/1000)}k de meta ${ctx.moeda==='USD'?'US$':'R$'}${Math.round(ctx.metaVal/1000)}k (${ctx.pctMeta}%)
- Falta: ${ctx.moeda==='USD'?'US$':'R$'}${Math.round(ctx.metaRestante/1000)}k em ${ctx.diasMes - ctx.diaHoje} dias
- Pedidos: ${ctx.pedidosMes} | Clientes: ${ctx.clientesMes}
- Projeção fim do mês: ${ctx.moeda==='USD'?'US$':'R$'}${Math.round(ctx.projecao/1000)}k
- Mês anterior: ${ctx.moeda==='USD'?'US$':'R$'}${Math.round(ctx.fatAnt/1000)}k

LIGAÇÕES (últimos 90 dias):
- Total: ${ctx.totalLig} | Atendidas: ${ctx.ligAtendidas} | Taxa atendimento: ${ctx.taxaAtend}%

CONVERSÃO E TICKET:
- Taxa conversão lig→pedido: ${ctx.taxaConv}%
- Ticket médio (3 meses): ${ctx.moeda==='USD'?'US$':'R$'}${Math.round(ctx.ticketMedio/1000)}k

HISTÓRICO POR MÊS: ${JSON.stringify(ctx.porMes)}

Retorne APENAS JSON válido sem markdown:
{
  "positivos": [
    {"titulo":"...","txt":"1 frase específica com número real"},
    {"titulo":"...","txt":"1 frase específica com número real"}
  ],
  "melhorias": [
    {"titulo":"...","txt":"1 ação concreta e específica"},
    {"titulo":"...","txt":"1 ação concreta e específica"},
    {"titulo":"...","txt":"1 ação concreta e específica"}
  ],
  "projecao_txt": "1 frase sobre o que fazer para bater a meta com números reais",
  "alerta": "ok|warn|critico",
  "alerta_txt": "1 frase de diagnóstico direto"
}`;

    const r = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001', max_tokens: 1000,
        system: 'Coach de vendas Sabagram. Retorne APENAS JSON válido, sem texto extra.',
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await r.json();
    const text = data.content?.find(b => b.type==='text')?.text || '{}';
    return JSON.parse(text.replace(/```json|```/g,'').trim());
  } catch(e) {
    console.error('Insights IA erro:', e);
    return { positivos: [], melhorias: [], projecao_txt: '', alerta: 'warn', alerta_txt: 'Dados carregados do Firestore.' };
  }
}

    const pct = Math.round(v.faturamento / maxFat * 100);

// ─── FILA ────────────────────────────────────────────────────────────────────
function urgencia(c){
  const p = c.prioridade;
  if(p) return p;
  const dias=parseFloat(c.QtdDip__c)||0;
  const score=parseInt(c.ScoAco__c)||0;
  if(score>=4&&dias>180)return'URGENTE';
  if(score>=3&&dias>90)return'URGENTE';
  if(dias>90)return'ALTA';
  if(dias>60)return'MÉDIA';
  return'NORMAL';
}

function statusTag(c){
  if(c.contatado&&c.respondeu)return{txt:'✓ Respondeu',bg:'#dcfce7',cor:'#166534'};
  if(c.contatado)return{txt:'✓ Contatado',bg:'#d1fae5',cor:'#065f46'};
  return{txt:'⏳ Pendente',bg:'#fee2e2',cor:'#991b1b'};
}

function renderFila(fila,vInfo){
  const pc=p=>p==='URGENTE'?'color:#f87171':p==='ALTA'||p==='CRÍTICO'?'color:#fbbf24':'color:#60a5fa';
  const pbg=p=>p==='URGENTE'||p==='CRÍTICO'?'rgba(248,113,113,.18)':p==='ALTA'?'rgba(251,191,36,.18)':'rgba(96,165,250,.18)';
  const stars=s=>s?'⭐'.repeat(Math.min(parseInt(s)||1,5)):'';
  const contatados=fila.filter(c=>c.contatado).length;
  const meta=fila.length;
  const pctVal=meta>0?Math.round(contatados/meta*100):0;

  const rows=fila.map((c,i)=>{
    const u=urgencia(c);
    const st=statusTag(c);
    const dias=parseFloat(c.QtdDip__c)||0;
    const mc=(c.canal||c.modo||'WA')==='WA';
    return`<div style="display:grid;grid-template-columns:1.7fr 1.9fr 2.3fr 0.85fr;border:0.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:6px">
      <div style="background:#1a3254;padding:10px 12px;border-right:0.5px solid rgba(255,255,255,.1)">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap">
          <span style="display:inline-flex;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;background:${pbg(u)};${pc(u)}">${u}</span>
          <span style="display:inline-flex;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;background:${st.bg};color:${st.cor}">${st.txt}</span>
        </div>
        <div style="font-size:12px;font-weight:700;color:white;line-height:1.3;margin-bottom:3px">${i+1}. ${c.Name}</div>
        <div style="font-size:11px;color:#e0aa18;margin-bottom:3px">${stars(c.ScoAco__c)}</div>
        <div style="font-size:10px;color:rgba(255,255,255,.5);line-height:1.4">${dias} dias sem comprar · ${c.StsCli__c||'—'}</div>
      </div>
      <div style="padding:10px 12px;border-right:0.5px solid var(--border);background:var(--white)">
        ${c.DatUli__c?`<div style="margin-bottom:5px"><span style="display:inline-flex;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;background:#e6f1fb;color:#0c447c">📞 ${new Date(c.DatUli__c).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</span>${c.ResUli__c?` <span style="font-size:10px;font-weight:600;color:#4ade80">✓ ${c.ResUli__c}</span>`:''}</div>`:`<div style="font-size:10px;color:var(--muted);margin-bottom:5px">Sem contato recente</div>`}
        <div style="font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Contexto</div>
        <div style="font-size:11px;color:var(--text2);line-height:1.5">${c.contexto||c.motivo||'—'}</div>
      </div>
      <div style="padding:10px 12px;border-right:0.5px solid var(--border);background:var(--white)">
        <div style="font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Script IA</div>
        <div style="font-size:11px;color:var(--text2);line-height:1.55;font-style:italic">${c.script||'—'}</div>
        ${c.melhorHorario?`<div style="margin-top:6px;font-size:10px;color:var(--muted)">⏰ Melhor horário: ${c.melhorHorario}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 8px;background:var(--white)">
        <button onclick="window.marcarFeito(this,'${c.Id}')" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:600;border:0.5px solid;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;background:${mc?'#eaf3de':'#e6f1fb'};color:${mc?'#1a5f3a':'#0c447c'};border-color:${mc?'#c0dd97':'#b5d4f4'}">
          ${mc?'💬 WA':'📞 Ligar'}
        </button>
      </div>
    </div>`;
  }).join('');

  return`<div style="background:var(--navy);border-radius:8px;padding:12px 14px;margin-bottom:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div>
        <div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px">Sua fila de hoje</div>
        <div style="font-size:13px;color:white">Priorize os <strong style="color:var(--gold-l)">URGENTES e CRÍTICOS</strong> primeiro</div>
      </div>
      <div style="text-align:right"><div style="font-size:20px;font-weight:800;color:var(--gold-l)">${fila.length}</div><div style="font-size:9px;color:rgba(255,255,255,.4)">clientes na fila</div></div>
    </div>
    <div style="border-top:0.5px solid rgba(255,255,255,.1);padding-top:8px;display:flex;gap:16px;font-size:11px">
      <span style="color:#4ade80;font-weight:600">✓ ${contatados} contatados</span>
      <span style="color:#fbbf24;font-weight:600">⏳ ${fila.length-contatados} pendentes</span>
      <span style="color:rgba(255,255,255,.5)">${pctVal}% cumprido</span>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1.7fr 1.9fr 2.3fr 0.85fr;gap:0;margin-bottom:4px;padding:0 2px">
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:0 10px">Cliente</div>
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:0 10px">Último contato</div>
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:0 10px">Script IA</div>
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;text-align:center">Ação</div>
  </div>
  ${rows}`;
}

async function carregarFila(email){
  const container=$('fila-container');
  const hoje=new Date().toISOString().slice(0,10);
  const vInfo=VENDEDORES[email];
  const emailKey=email.replace(/[@.]/g,'_');
  try{
    const user=auth.currentUser;
    if(!user)return;
    const token=await user.getIdToken();
    const resp=await fetch(`/api/fila?email=${emailKey}&data=${hoje}`,{headers:{Authorization:`Bearer ${token}`}});
    const data=await resp.json();
    const fila=data.fila||[];
    if(!fila.length){
      container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">
        <div style="font-size:24px;margin-bottom:8px">📭</div>
        Nenhum cliente na sua fila hoje.<br>
        <span style="font-size:11px">A fila é montada às 06h com dados do Salesforce.</span>
      </div>`;
      return;
    }
    container.innerHTML=renderFila(fila,vInfo);
  }catch(e){
    console.error('Erro fila:',e);
    container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--red);font-size:13px">Erro ao carregar a fila.</div>`;
  }
}

const feitosLocal={};
window.marcarFeito=(btn,id)=>{
  feitosLocal[id]=!feitosLocal[id];
  const orig=btn.textContent;btn.textContent='✓';
  setTimeout(()=>{btn.textContent=orig;},600);
};
window.sair=async()=>{await signOut(auth);window.location.href='index.html';};

let _emailAtual='';
let _filaCarregada=false;

window.showTab=(id,btn)=>{
  ['desempenho','fila'].forEach(t=>{const el=$('tab-'+t);if(el)el.style.display='none';});
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  const sec=$('tab-'+id);if(sec)sec.style.display='block';
  btn.classList.add('on');
  if(id==='fila'&&!_filaCarregada&&_emailAtual){
    _filaCarregada=true;
    carregarFila(_emailAtual);
  }
};

async function resolverVendedor(email){
  const base=VENDEDORES[email]||{};
  try{
    const snap=await getDoc(doc(db,'usuarios',email));
    if(snap.exists()){
      const d=snap.data();
      if(['vendedor','gerente','admin'].includes(d.perfil)){
        return{...base,nome:d.nome||base.nome,bu:d.bu||base.bu,email};
      }
    }
  }catch(e){}
  return Object.keys(base).length?{...base,email}:null;
}

function carregarVendedorUI(email,v,isPreview){
  $('vAv').textContent=v.avatar||v.nome?.slice(0,2)||'??';
  $('vAv').style.background=v.cor||'#1a3254';
  $('vNome').textContent=(isPreview?'[Preview] ':'Bom dia, ')+v.nome.split(' ')[0]+(isPreview?' — visão do vendedor':'!');
  $('vSub').textContent=(v.bu||'')+ ' · Meta '+(v.moeda==='USD'?'US$':'R$')+Math.round((v.metaVal||0)/1000)+'k · '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  $('vhdr').style.display='flex';
  if(isPreview){
    const bar=document.createElement('div');
    bar.style.cssText='background:#d97706;color:white;text-align:center;font-size:11px;font-weight:700;padding:5px;letter-spacing:.05em;flex-shrink:0';
    bar.textContent='MODO PREVIEW — você está vendo a tela de '+v.nome+' (somente leitura)';
    document.body.insertBefore(bar,document.body.firstChild);
  }
  carregarDesempenho(email, v);
}

const previewE=new URLSearchParams(window.location.search).get('preview');
if(previewE){
  onAuthStateChanged(auth,async user=>{
    if(!user){window.location.href='index.html';return;}
    const v=await resolverVendedor(previewE);
    if(v){carregarVendedorUI(previewE,v,true);_emailAtual=previewE;}
    else window.location.href='gerente.html';
  });
}else{
  onAuthStateChanged(auth,async user=>{
    if(!user){window.location.href='index.html';return;}
    const email=user.email.toLowerCase();
    const v=await resolverVendedor(email);
    if(v){carregarVendedorUI(email,v,false);_emailAtual=email;}
    else{await signOut(auth);window.location.href='index.html';}
  });
}
